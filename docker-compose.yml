# 로컬 개발용 (Docker-only). compose가 `.` 경로를 자체 해석 → Git Bash 마운트 폴백 회피.
#   docker compose build
#   docker compose run --rm test        # 파이썬 테스트 (Firestore 에뮬레이터에 붙어서 실행)
#   docker compose run --rm webtest     # 웹 순수로직 테스트 (tests/web/*.test.mjs)
#   docker compose run --rm collect     # 1회 수집 (.env 필요: cp .env.example .env)
services:
  firestore-emulator:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:emulators
    command: gcloud emulators firestore start --host-port=0.0.0.0:8080 --project=test
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost',8080),2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  test:
    build:
      context: .
      dockerfile: infra/Dockerfile
      args:                       # dev(pytest)+gcp(google-cloud-firestore) — 에뮬레이터 테스트용
        INSTALL_DEV: "true"
        INSTALL_GCP: "true"
    image: newsstore-test
    depends_on:
      firestore-emulator:
        condition: service_healthy
    environment:
      FIRESTORE_EMULATOR_HOST: "firestore-emulator:8080"
      GOOGLE_CLOUD_PROJECT: "test"
    volumes:
      - ".:/app"
    command: pytest -q

  webtest:                        # web/*.mjs 순수 로직 가드 — 파이썬 러너가 .mjs를 수집하지 못해
    image: node:22-alpine         # 별도 서비스로 둔다(에뮬레이터·파이썬 의존 없음).
    working_dir: /app
    volumes:
      - ".:/app"
    # 디렉터리 인자(`node --test tests/web/`)는 MODULE_NOT_FOUND로 죽어 glob을 쓴다(node가 직접 전개).
    # 앞의 `ls`는 fail-loud 가드다 — glob이 0개를 맞추면 node가 exit 0으로 조용히 통과하므로,
    # 파일명이 바뀌어 가드가 텅 비는 순간을 여기서 터뜨린다(기대 개수는 박지 않는다).
    command: sh -c 'set -e; ls tests/web/*.test.mjs > /dev/null; node --test "tests/web/*.test.mjs"'

  collect:
    build:                        # 머리말 절차(docker compose build)만으로 실행 가능해야 한다 —
      context: .                  # 빌드 주체 없는 image 참조는 'image not found'로 깨진다.
      dockerfile: infra/Dockerfile
      args:
        INSTALL_DEV: "false"
        INSTALL_GCP: "true"       # 실 Firestore 접속(run_collect_all) — firestore 라이브러리 필수
        INSTALL_EMBED: "true"     # 임베딩 패스(gemini) — 백필 실행도 이 서비스로
    image: newsstore
    volumes:
      - ".:/app"
    env_file:
      - .env
    command: python -m newsstore.entrypoints.run_collect_all
