# LLM 사용시점(usage)별 모델 지정 — 단일 출처(SSOT). 소비자: enrich/model_config.py
#
# 방침(2026-07-04 사용자 결정): "워커는 낮게, 리뷰어는 높게"
#  - 워커 = 결정론적 비교·분류·채점("A와 B 차이점은?" 류) → 싼 모델(flash-lite)
#  - 추론 = 무에서 짜내는 합성(프레임 생성, 리포트 전 과정)과 리뷰어 → 상위 모델(3.5 flash)
#
# 계약(FAIL-LOUD): 키 집합은 model_config.USAGES와 정확히 일치해야 한다(누락/잉여 = 기동 에러).
# 새 LLM 콜 사이트를 추가하면 ① 여기 ② USAGES ③ 콜 사이트 model_for("...") 셋 다 갱신
# (드리프트는 tests/test_model_config.py가 터뜨린다).
#
# 반영 경로: 이 파일은 이미지에 COPY됨 → 변경 시 processor 재빌드(docs/operations.md §E).
# 비상 오버라이드: env GEMINI_MODEL(모든 usage에 우선) — 재빌드 없이 잡 env로 즉시 적용.
usages:
  # ── 워커 (결정론 비교·분류) ──
  cluster_judge: gemini-3.1-flash-lite-preview   # gray-band "같은 사가?" 판정
  summary: gemini-3.1-flash-lite-preview         # 스토리 요약·델타/마일스톤
  lenses: gemini-3.1-flash-lite-preview          # 토픽 렌즈 멀티라벨 분류
  score: gemini-3.1-flash-lite-preview           # dual risk/impact 0~3 채점
  article: gemini-3.1-flash-lite-preview         # 스토리 단위 기사(10분 주기 — 고빈도)
  tag: gemini-3.1-flash-lite-preview             # 기사 태깅(운영 미가동 — #29)
  # ── 추론·리뷰어 (합성/심사) ──
  frame_gen: gemini-3.5-flash                    # standing 프레임 재심(짜내기)
  frame_review: gemini-3.5-flash                 # 프레임 diff-grounding 심사
  report_backdrop: gemini-3.5-flash              # 매크로 백드롭 합성
  report_section: gemini-3.5-flash               # 섹터 리포트 섹션 합성
  report_review: gemini-3.5-flash                # 리포트 grounding+fit 심사
