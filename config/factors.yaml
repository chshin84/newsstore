# 팩터·펀더멘털 수집 대상 (SSOT) — 소비자: entrypoints/run_factors.py
#
# 유니버스 소스는 둘 중 하나(universe):
#   screener    : company-screener 시총 상위 N(screener_limit). 지수 밖 종목도 포함(더 넓다).
#   constituent : indices(sp500·nasdaq·dowjones)의 현재 구성종목 합집합(~600).
# 어느 쪽이든 그 시점 명단을 index_members에 스냅샷해 생존편향 PIT를 보존한다(collect/universe.py).
# 계약(컬렉션·필드·TTL·주기)의 SSOT는 docs/firestore-contract.md.
universe: screener
screener_limit: 1000      # universe=screener일 때 시총 상위 N (일단 1000)
indices:                  # universe=constituent일 때만 사용
  - sp500
  - nasdaq
  - dowjones
max_symbols: 0            # 유니버스 상한(0=무제한). 초기 검증·비용 통제용 — 사전순 앞에서 자른다.
