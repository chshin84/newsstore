# Cloud Build config for the Step-2 enrichment Processor image (Cloud Run Job #2).
# Same Dockerfile as the collector but with the [enrich] extra (google-genai) +
# [gcp] (firestore). Separate image tag keeps the collector image lean.
#
# NOTE: requirements.lock must already include google-genai + its transitive deps
# (regenerate the lock before the first processor build — see docs/operations.md §E).
#
# Usage (from repo root, authenticated):
#   gcloud builds submit --config infra/cloudbuild.processor.yaml \
#     --substitutions=_IMAGE=asia-northeast3-docker.pkg.dev/<PROJECT_ID>/newsstore/processor:latest .
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - infra/Dockerfile
      - --build-arg
      - INSTALL_DEV=false
      - --build-arg
      - INSTALL_GCP=true
      - --build-arg
      - INSTALL_ENRICH=true
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
