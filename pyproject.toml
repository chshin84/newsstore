[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsstore"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1.0",
    "feedparser>=6.0,<7.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.2,<7.0",
    "pydantic>=2.7,<3.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "mock-firestore>=0.11.0"]
gcp = ["google-cloud-firestore>=2.16"]
# Step-2 LLM 인리치(Processor Job#2 전용). 로직은 DI라 미설치 환경서도 테스트 가능;
# 실 GeminiClient만 이 SDK에 의존(lazy import). GEMINI_API_KEY=Developer API 경로.
enrich = ["google-genai>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
