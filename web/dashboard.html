<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>newsstore — 수집 상태</title>
<script>
  // FOUC 방지: 저장된 테마를 루트에 즉시 반영.
  document.documentElement.dataset.theme = localStorage.getItem("ns_theme")
    || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
</script>
<style>
  /* 쿨 뉴트럴 + 의미론적 상태색(green/amber/red)만 채도 — 웜크림/테라코타 AI 기본 팔레트 탈피. */
  :root {
    --bg:#f5f6f8; --surface:#ffffff; --surface-2:#fafbfc; --line:#e5e8ec; --line-2:#d7dbe1;
    --ink:#181b21; --sub:#414650; --mut:#878e9a; --accent:#2f5fe0;
    --ok:#12885a; --ok-bg:#e7f4ee; --warn:#b26b09; --warn-bg:#fbf0dd; --bad:#cc3646; --bad-bg:#fbe9eb;
    --shadow:rgba(24,27,33,.06);
    color-scheme:light;
  }
  :root[data-theme="dark"] {
    --bg:#101216; --surface:#191c22; --surface-2:#15181d; --line:#282d36; --line-2:#333a44;
    --ink:#e9ebef; --sub:#b4bac4; --mut:#767d8a; --accent:#6f9bff;
    --ok:#3fb583; --ok-bg:#152a22; --warn:#d99a3e; --warn-bg:#2c2415; --bad:#e5646f; --bad-bg:#2d1a1d;
    --shadow:rgba(0,0,0,.4);
    color-scheme:dark;
  }
  * { box-sizing:border-box; }
  html { scrollbar-gutter:stable; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num { font-variant-numeric:tabular-nums; }
  .wrap { max-width:640px; margin:0 auto; padding:0 20px; }

  header { border-bottom:1px solid var(--line); background:var(--surface); }
  .head { display:flex; align-items:center; justify-content:space-between; padding:18px 0 16px; gap:12px; }
  .brand { display:flex; flex-direction:column; gap:2px; }
  .brand h1 { font-size:17px; font-weight:650; letter-spacing:-.2px; margin:0; }
  .brand p { margin:0; font-size:12.5px; color:var(--mut); }
  .head-actions { display:flex; align-items:center; gap:8px; }
  button {
    font:inherit; font-size:13px; color:var(--sub); background:var(--surface-2);
    border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer;
    transition:background .12s, transform .06s;
  }
  @media (hover:hover) { button:hover { background:var(--bg); } }
  button:active { transform:translateY(1px); }

  main { padding:22px 0 40px; display:flex; flex-direction:column; gap:22px; }

  /* 전체 상태 요약 — 한눈에 초록/경고. */
  .summary {
    display:flex; align-items:center; gap:14px;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:18px 20px; box-shadow:0 1px 2px var(--shadow);
  }
  .summary .beacon { width:12px; height:12px; border-radius:50%; flex:none; box-shadow:0 0 0 4px var(--ok-bg); background:var(--ok); }
  .summary.warn .beacon { background:var(--warn); box-shadow:0 0 0 4px var(--warn-bg); }
  .summary.bad .beacon { background:var(--bad); box-shadow:0 0 0 4px var(--bad-bg); }
  .summary .stext { min-width:0; }
  .summary .stext b { font-size:16px; font-weight:600; letter-spacing:-.2px; }
  .summary .stext span { display:block; font-size:12.5px; color:var(--mut); margin-top:1px; }

  .section-label {
    font-size:11.5px; font-weight:650; letter-spacing:.04em; text-transform:uppercase;
    color:var(--mut); margin:0 0 10px 2px;
  }

  /* 상태 행 — 이모지 대신 semantic 도트 + 칩. */
  .rows { background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .row { display:flex; align-items:center; gap:12px; padding:15px 18px; }
  .row + .row { border-top:1px solid var(--line); }
  .dot { width:9px; height:9px; border-radius:50%; flex:none; background:var(--mut); }
  .row.ok  .dot { background:var(--ok); }
  .row.warn .dot { background:var(--warn); }
  .row.bad .dot { background:var(--bad); }
  .row .name { font-size:14.5px; font-weight:550; }
  .row .detail { font-size:12.5px; color:var(--mut); margin-top:2px; word-break:break-word; }
  .row .body { min-width:0; flex:1; }
  .chip {
    flex:none; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:999px;
    background:var(--surface-2); color:var(--sub); border:1px solid var(--line-2);
  }
  .row.ok  .chip { background:var(--ok-bg);  color:var(--ok);  border-color:transparent; }
  .row.warn .chip { background:var(--warn-bg); color:var(--warn); border-color:transparent; }
  .row.bad .chip { background:var(--bad-bg); color:var(--bad); border-color:transparent; }
  .when { flex:none; font-size:12px; color:var(--mut); text-align:right; min-width:64px; }

  .foot { color:var(--mut); font-size:12px; text-align:center; padding-top:4px; }
  .foot a { color:var(--accent); text-decoration:none; }
  .load-err { color:var(--bad); font-size:13px; padding:16px 2px; }
</style>
</head>
<body>
<header><div class="wrap">
  <div class="head">
    <div class="brand">
      <h1>수집 상태</h1>
      <p>newsstore · 뉴스 수집 파이프라인</p>
    </div>
    <div class="head-actions">
      <span class="when num" id="loaded"></span>
      <button id="theme" title="테마 전환">테마</button>
      <button id="refresh">새로고침</button>
    </div>
  </div>
</div></header>

<main class="wrap">
  <div class="summary" id="summary">
    <span class="beacon"></span>
    <div class="stext"><b id="sum-title">확인 중…</b><span id="sum-sub"></span></div>
  </div>

  <section>
    <p class="section-label">수집 잡</p>
    <div class="rows" id="joblist"></div>
  </section>

  <section>
    <p class="section-label">데이터 신선도</p>
    <div class="rows" id="cardlist"></div>
  </section>

  <p class="foot">10분마다 자동 갱신 · <a href="./index.html">뉴스 보기</a></p>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, orderBy, limit, getDocs, doc, getDoc }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./config.js";
import { CARDS, JOBS, jobVerdict, isOverdue, relTime, cardFreshness }
  from "./dashboard_logic.mjs";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const $ = (id) => document.getElementById(id);
const toMs = (ts) => {
  if (!ts) return null;
  if (typeof ts.toMillis === "function") return ts.toMillis();
  const t = Date.parse(ts); return Number.isFinite(t) ? t : null;
};
const LEVEL_RANK = { ok: 0, warn: 1, bad: 2 };
const LEVEL_TEXT = { ok: "정상", warn: "주의", bad: "점검 필요" };

// 테마 토글(뉴스 리더와 공유 키).
$("theme").onclick = () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next; localStorage.setItem("ns_theme", next);
};

load().catch(showLoadError);
setInterval(() => load().catch(() => {}), 10 * 60 * 1000);
$("refresh").onclick = () => load().catch(showLoadError);

// detail에는 피드에서 온 기사 제목·발행처가 섞여 들어온다 — 원문을 그대로 innerHTML에
// 넣으면 피드 제목이 마크업으로 실행된다. index.html의 esc와 같은 규칙을 쓴다.
function esc(s) {
  return (s || "").replace(/[&<>"']/g, c =>
    ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}
function showLoadError(e) {
  $("joblist").innerHTML = `<div class="row"><div class="load-err">불러오기 실패: ${esc(e.code || e.message)}</div></div>`;
}
function rowHtml(level, name, detail, when) {
  const chip = LEVEL_TEXT[level] || "—";
  return `<div class="row ${level}">
    <span class="dot"></span>
    <div class="body"><div class="name">${esc(name)}</div>${detail ? `<div class="detail">${esc(detail)}</div>` : ""}</div>
    <span class="chip">${chip}</span>
    <span class="when num">${when}</span>
  </div>`;
}

async function latestFetched(coll) {
  const snap = await getDocs(query(collection(db, coll), orderBy("fetched_at", "desc"), limit(1)));
  if (snap.empty) return { ms: null, doc: null };
  const d = snap.docs[0].data();
  return { ms: toMs(d.fetched_at), doc: d };
}

async function load() {
  $("loaded").textContent = new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
  const now = Date.now();
  let worst = "ok";

  // 잡 헬스
  const jobRows = [];
  for (const j of JOBS) {
    let hd = null;
    try { const s = await getDoc(doc(db, "job_health", j.key)); hd = s.exists() ? s.data() : null; }
    catch (e) { hd = null; }
    const h = hd ? { lastStatus: hd.last_status, fetchedMs: toMs(hd.fetched_at) } : null;
    const v = jobVerdict(h, j.expectedSec, now);
    if (LEVEL_RANK[v.level] > LEVEL_RANK[worst]) worst = v.level;
    const when = h && h.fetchedMs ? relTime(h.fetchedMs, now) : "기록 없음";
    const detail = (hd && hd.detail) ? hd.detail : v.text;
    jobRows.push(rowHtml(v.level, j.label, detail, when));
  }
  $("joblist").innerHTML = jobRows.join("");

  // 데이터 신선도
  const cardRows = [];
  for (const c of CARDS) {
    const results = await Promise.all(c.collections.map(latestFetched));
    const { lastFetchedMs, anyEmpty } = cardFreshness(results.map(r => r.ms));
    const verdict = isOverdue(lastFetchedMs, c, now);
    const level = verdict.overdue ? "bad" : "ok";
    if (LEVEL_RANK[level] > LEVEL_RANK[worst]) worst = level;
    const when = lastFetchedMs == null ? "없음" : relTime(lastFetchedMs, now);
    const d = results[0].doc;
    const detail = d ? `최근: ${d.source || ""}${d.title ? " · " + d.title.slice(0, 44) : ""}`
                     : (anyEmpty ? "수집된 데이터 없음" : "");
    cardRows.push(rowHtml(level, c.label, detail, when));
  }
  $("cardlist").innerHTML = cardRows.join("");

  // 전체 요약
  const sum = $("summary");
  sum.className = "summary " + worst;
  $("sum-title").textContent = worst === "ok" ? "모두 정상" : worst === "warn" ? "주의가 필요합니다" : "점검이 필요합니다";
  $("sum-sub").textContent = worst === "ok"
    ? "수집 잡과 데이터가 정상 주기로 갱신되고 있습니다."
    : "아래 항목에서 지연·실패·정지를 확인하세요.";
}
</script>
</body>
</html>
