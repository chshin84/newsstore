        const frames = {}; frameSnap.docs.forEach(d => frames[d.id] = d.data());
        const groups = groupsSnap.exists() ? ((groupsSnap.data() || {}).groups || []) : [];
        // _skips는 그룹 렌즈 id가 아니므로 assembleReportDoc(그룹 id 키잉)에서 자동 배제된다(M5)
        const skips = (reports._skips && reports._skips.lenses) || [];
        const docm = assembleReportDoc(groups, reports);
        buildReportNav(docm);                          // B5: 사이드바 리포트 목차(빈 문서면 '리포트 없음')
        // WV3: v2 뷰에서만 signals/unexplained_moves 조사 큐를 추가로 읽는다(v1은 read 0 — 낭비 없음).
        const v2 = currentView() === "v2";             // WV1: 렌더 진입점이 뷰를 읽는다
        let queue = null;
        if (v2) {
          try {
            const sig = await getDoc(doc(db, "signals", "unexplained_moves"));
            queue = sig.exists() ? unexplainedQueue(sig.data()) : null;   // 부재/실패 graceful(배포 순서 무관)
          } catch (e) { queue = null; }
        }
        // v2 + 큐만 있고 리포트가 비어도 큐는 보여준다(graceful). 그 외 빈 문서는 기존 안내.
        if (!docm.sections.length && !(v2 && queue && queue.items.length)) {
          reportDocEl.innerHTML = `<div class="sempty">아직 생성된 리포트가 없어요.<br>매일 아침 자동 생성됩니다.</div>`;
          return;
        }
        const now = Date.now();
        const links = crossLinks(docm.sections);
        // B3: 초기 렌더는 items/스토리 문서를 전혀 fetch하지 않는다(0). 근거 기사는 토글 펼칠 때 lazy.
        renderReportDoc(docm, frames, links, now, skips, queue);
        setupReportSpy();                              // B5: 스크롤 스파이(현재 섹션 하이라이트)
        // 2a: async 렌더 완료 후 딥링크(#rep-*) 재스크롤 — 네이티브 앵커는 섹션 렌더 전 헛돎.
        const rt = parseHashView(location.hash).route; // 뷰 토큰(&v2) 제거한 순수 경로로 앵커 조회
        if (rt.startsWith("#rep-")) document.getElementById(rt.slice(1))?.scrollIntoView({ block: "start" });
      } catch (e) {
        reportLoaded = false;                          // 고착 방지: 탭 재진입/‘다시 시도’로 재로드되게
        reportDocEl.innerHTML = `<div class="error">리포트를 불러오지 못했어요: <code>${esc(e.message)}</code>`
          + `<br><button class="retry-report" type="button" style="margin-top:10px">다시 시도</button></div>`;
      }
    }

    const SEC_LABEL = { risk_triggered: "아킬레스건 트리거", premium_triggered: "기대 트리거",
                        not_triggered: "미발생", watchpoints: "주시 포인트" };
    function frameChipsHtml(f) {
      if (!f) return "";
      // 3a: achilles_kind 이중부호화 — words_deeds(RAS 말-행동 괴리)는 ⚡ + 근거건수, structural은 파선.
      // WW3: 위험/기대/주시 구분은 색이 아니라 카테고리 라벨(.fcat: 아이콘 모양 + 텍스트)로 — 색맹·중립 안전.
      const ax = (arr, cls, catIcon, catLabel) => (arr || []).map(p => {
        const kind = p.achilles_kind, evN = (p.evidence_dev_ids || []).length;
        const ras = kind === "words_deeds" ? `<span class="ras" aria-label="말-행동 괴리">⚡</span>` : "";
        const evn = evN ? `<sup class="evn">${evN}</sup>` : "";
        const title = kind === "words_deeds" ? `말-행동 괴리(RAS) · 근거 ${evN}건`
          : kind === "structural" ? "구조적 이월" : esc(p.id || "");
        const cat = `<span class="fcat"><span class="fcat-i" aria-hidden="true">${catIcon}</span>${catLabel}</span>`;
        return `<span class="fchip ${cls}${kind === "structural" ? " structural" : ""}" title="${esc(title)}">${cat}${ras}${txt(p.text)}${evn}</span>`;
      }).join("");
      return `<div class="fchips">${ax(f.risks, "risk", "▲", "위험")}${ax(f.premiums, "imp", "◆", "기대")}${ax(f.watchpoints, "green", "◇", "주시")}</div>`;
    }
    function tsToMs(v) {
      if (!v) return null;
      if (typeof v.toDate === "function") return v.toDate().getTime();
      const n = new Date(v).getTime();

    reportDocEl.addEventListener("click", async e => {

    // ============================ 사이드바 네비 (B5) ============================

        }
      }, { rootMargin: "-110px 0px -68% 0px" });
      secs.forEach(s => reportSpy.observe(s));
    }
    function closeDrawer() { sidenav.classList.remove("open"); navScrim.hidden = true; }
    // B1(#1·#7): 좌상단 토글 — 모바일은 드로어 여닫기, 데스크톱은 접기(nav-collapsed, 상태 유지).
    function isMobileNav() { return matchMedia("(max-width:680px)").matches; }
    function syncSideToggle() {
      const expanded = isMobileNav() ? sidenav.classList.contains("open")
                                     : !document.body.classList.contains("nav-collapsed");
      sideToggle.setAttribute("aria-expanded", expanded ? "true" : "false");
    }
    sideToggle.addEventListener("click", () => {
      if (isMobileNav()) { navScrim.hidden = !sidenav.classList.toggle("open"); }
      else {
        const collapsed = document.body.classList.toggle("nav-collapsed");
        localStorage.setItem("ns_nav", collapsed ? "collapsed" : "open");   // 데스크톱 접힘 상태 유지
      }
      syncSideToggle();
    });
    navScrim.addEventListener("click", () => { closeDrawer(); syncSideToggle(); });
    sidenav.addEventListener("click", e => { if (e.target.closest("a")) { closeDrawer(); syncSideToggle(); } });  // 링크→드로어 닫힘(hashchange가 라우팅)
    matchMedia("(min-width:681px)").addEventListener("change", e => { if (e.matches) closeDrawer(); syncSideToggle(); });  // 데스크톱 진입 시 드로어 잔재 초기화 · 양방향 토글 aria 동기화
    // 데스크톱 접힘 상태 복원(모바일에선 nav-collapsed가 CSS상 무효라 무해)
    if (localStorage.getItem("ns_nav") === "collapsed") document.body.classList.add("nav-collapsed");
    syncSideToggle();

    // ============================ 가격 뷰 ============================
    const priceView = document.getElementById("priceView");
    const priceDocEl = document.getElementById("priceDoc");
    const tabPrice = document.getElementById("tabPrice");
    let priceLoaded = false;

    function fmtClose(close, currency) {
      const n = Number(close);
      if (!Number.isFinite(n)) return "—";
      try { return new Intl.NumberFormat("ko-KR",
        { maximumFractionDigits: currency === "KRW" ? 0 : 2 }).format(n); }
      catch (e) { return String(n); }
    }
    function pctStr(pct) {
      const n = Number(pct); if (!Number.isFinite(n)) return "—";
      const c = pctClass(n); return `${c === "up" ? "▲" : c === "down" ? "▼" : "·"}${Math.abs(n).toFixed(2)}%`;
    }
    async function loadPrices(bg) {
      if (!bg) priceDocEl.innerHTML = `<div class="sempty">불러오는 중…</div>`;
      try {
        const snap = await getDocs(collection(db, "prices"));
        const prices = {}; snap.docs.forEach(d => prices[d.id] = d.data());
        if (!Object.keys(prices).length) {
          priceDocEl.innerHTML = `<div class="sempty">가격 데이터 준비 중이에요.</div>`;
          return;
        }
        renderPriceDashboard(prices);
      } catch (e) {
        priceDocEl.innerHTML = `<div class="sempty">불러오기 실패: <code>${esc(e.message)}</code></div>`;
      }
    }
    function renderPriceDashboard(prices) {
      // 값 + 차트만. 뉴스와의 정합(over/under-reaction)은 별도 — 여기선 순수 시세.
      const cards = Object.entries(prices).map(([key, p]) => {
        const cls = pctClass(p.percent_change);
        const pts = sparkPoints(p.series, 220, 46);
        const chart = pts
          ? `<svg class="pspark ${cls}" viewBox="0 0 220 46" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}"/></svg>`
          : `<div class="pspark-empty">차트 준비 중</div>`;
        return `<div class="pcard">
          <div class="pc-h"><span class="pc-name">${txt(p.label || key)}</span><span class="pc-sym">${esc(p.symbol || "")}</span></div>
          <div class="pc-val">${fmtClose(p.close, p.currency)}</div>
          <div class="pc-pct ${cls}">${pctStr(p.percent_change)}</div>
          ${chart}
          <div class="pc-meta">${p.datetime ? esc(String(p.datetime)) : ""}${p.currency ? " · " + esc(p.currency) : ""}</div></div>`;
      }).join("");
      priceDocEl.innerHTML = `<div class="pcards">${cards}</div>`;
    }

    // ============================ v1↔v2 뷰 상태 (WV1) ============================
    // 뷰 상태 SSOT: 딥링크 해시(&v2)와 localStorage(ns_view). currentView()가 단일 진입점 —
    // 모든 렌더(loadStories·loadReport·rerenderActiveTab·5분폴링·탭재진입·딥링크)가 이걸 읽어 분기한다.
    const VIEW_KEY = "ns_view";
    const viewToggle = document.getElementById("viewToggle");
    function storedView() { const v = localStorage.getItem(VIEW_KEY); return v === "v2" ? "v2" : "v1"; }
    let viewState = storedView();                     // routeFromHash가 URL·저장값으로 재해결
    function currentView() { return viewState; }
    function syncViewToggle() {
      viewToggle.querySelectorAll(".vtb").forEach(b => b.classList.toggle("on", b.dataset.view === viewState));
    }
    function selectView(v) {
      if (!VIEWS.includes(v) || v === viewState) return;
      localStorage.setItem(VIEW_KEY, v);              // 저장(해시 토큰이 없어도 새로고침 유지)
      const base = parseHashView(location.hash).route || "#report";
      location.hash = withView(base, v);              // hashchange → routeFromHash가 재해결·재렌더(딥링크 뷰상태)
    }
    viewToggle.addEventListener("click", e => { const b = e.target.closest(".vtb"); if (b) selectView(b.dataset.view); });

    function showTab(which) {
      const stories = which === "stories", report = which === "report", price = which === "price";
      const feed = !stories && !report && !price;
      feedView.hidden = !feed; feedControls.hidden = !feed;
      storiesView.hidden = !stories; reportView.hidden = !report; priceView.hidden = !price;
      tabFeed.classList.toggle("active", feed);
      tabStories.classList.toggle("active", stories);
      tabReport.classList.toggle("active", report);
      tabPrice.classList.toggle("active", price);
      // B1: 사이드바 탭(폴더 헤더·가격 리프)도 현재 탭에 맞춰 active(헤더 탭과 동기화 — 둘 다 hash 라우팅)
      const key = feed ? "feed" : which;
      document.querySelectorAll(".navtab").forEach(a => a.classList.toggle("active", a.dataset.tab === key));

      // WV1 맥락 게이팅: v1↔v2 토글은 스토리·리포트 탭에서만 노출(피드·가격에선 no-op이라 숨김 — 혼란 방지)
      viewToggle.hidden = !(stories || report);
      if (!viewToggle.hidden) syncViewToggle();

      if (stories && !storiesLoaded) { storiesLoaded = true; loadStories(); }
      if (report && !reportLoaded) { reportLoaded = true; loadReport(); }
      if (price && !priceLoaded) { priceLoaded = true; loadPrices(); }
    }
    function invalidateHiddenTabs() {
      // WV1: 뷰가 바뀌면 비활성 로드탭을 무효화 → 재진입할 때 현재 뷰로 새로 렌더(재진입 후 v1 회귀·stale 방지).
      if (reportView.hidden) reportLoaded = false;
      if (storiesView.hidden) storiesLoaded = false;
    }
    function routeFromHash() {
      // #rep-* 는 리포트 문서 내 섹션 앵커 — 리포트 탭을 유지해야 브라우저 기본 스크롤이 동작(M1)
      // WV1: 해시에서 라우트와 뷰(&v2)를 분리 파싱. URL 뷰 > 저장값 > v1로 해결(딥링크 공유 재현).
      const { route, view: urlView } = parseHashView(location.hash);
      const resolved = resolveView(urlView, storedView());
      const viewChanged = resolved !== viewState;
      viewState = resolved;
      localStorage.setItem(VIEW_KEY, resolved);               // 해시가 명시한 뷰를 저장에도 반영(SSOT 수렴)
      if (route.startsWith("#story-")) {                       // 스토리 딥링크 → 스토리 탭 + 상세 열기
        const id = route.slice(7);
        const wasLoaded = storiesLoaded;
        if (!wasLoaded || viewChanged) pendingStoryId = id;    // 새 로드/재렌더가 끝에서 pending을 연다
        showTab("stories");
        if (viewChanged) invalidateHiddenTabs();
        if (wasLoaded) {
          if (viewChanged) loadStories();                     // 이미 로드 + 뷰 변경 → 현재 뷰로 재렌더(끝에서 pending 오픈)
          else if (openStoryId !== id) openStory(id);         // openStory가 storyById 없으면 직접 fetch
        }
        return;
      }
      const tab = route === "#stories" ? "stories"
        : (route === "#report" || route.startsWith("#rep-")) ? "report"
        : route === "#price" ? "price"
        : route === "#feed" ? "feed"
        : "report";                                            // B5: 디폴트 첫 화면 = 리포트(빈/미지 해시)
      const wasLoaded = tab === "report" ? reportLoaded : tab === "stories" ? storiesLoaded : true;
      showTab(tab);
      if (viewChanged) {
        invalidateHiddenTabs();
        // 이미 로드된 활성 탭(스토리·리포트)은 현재 뷰로 재렌더 — 새로고침·토글 후 v1 회귀 방지.
        if (wasLoaded && (tab === "stories" || tab === "report")) rerenderActiveTab();
      }
    }
    // 탭 클릭은 현재 뷰를 해시에 실어 나른다(스토리·리포트만 — 피드·가격은 뷰 no-op이라 청결하게 유지).
    tabFeed.addEventListener("click", () => { location.hash = "#feed"; });
    tabStories.addEventListener("click", () => { location.hash = withView("#stories", currentView()); });
    tabReport.addEventListener("click", () => { location.hash = withView("#report", currentView()); });
    tabPrice.addEventListener("click", () => { location.hash = "#price"; });
    window.addEventListener("hashchange", routeFromHash);

    initSources();
    routeFromHash();
    window.__nsBooted = true;      // B5: 모듈이 여기까지 실행됨 → 부트 워치독 폴백 무력화(import 실패만 폴백 발동)
    // B5: 디폴트가 리포트라 스토리 탭을 안 열면 사이드바 스토리 목록이 안 채워진다.
    // 스토리를 1회 백그라운드 로드해 목차를 완성한다(storiesLoaded=true로 탭 방문 시 중복 로드 방지).
    if (!storiesLoaded) { storiesLoaded = true; loadStories(true); }

    // 자동경신: 5분마다 활성 탭 데이터 재로드(헤더 "5분마다 갱신" 약속 이행).
    // 스토리 상세를 연 상태면 스토리 재로드 스킵(사용자 방해 방지), 백그라운드 탭이면 스킵(불필요한 read 절감).
    const AUTO_REFRESH_MS = 5 * 60 * 1000;
    setInterval(() => {
      if (document.hidden) return;
      // 4a: 깜빡임 없는 bg 갱신 + 펼친 카드가 있으면 스킵(사용자 방해 방지).
      // 4b: 리포트는 4×/일 생성이라 5분 폴링 제거(탭 재진입 시 갱신) — 낭비 read 절감.
      if (!storiesView.hidden) {
        if (!openStoryId && !stripEl.querySelector(".scard.open")) loadStories(true);
      } else if (!reportView.hidden) {
        /* 리포트는 폴링 안 함(4b) */
      } else {
        if (!listEl.querySelector(".card.open")) load(true);
      }
    }, AUTO_REFRESH_MS);

    // ===== 토대: 테마·글자크기 토글 (헤더 우상단 버튼) =====
    const themeBtn = document.getElementById("themeBtn");
    const fsBtn = document.getElementById("fsBtn");

    function syncThemeBtn() {
      themeBtn.textContent = document.documentElement.dataset.theme === "dark" ? "☀️" : "🌙";
    }
    function rerenderActiveTab() {
      // srcColors가 테마 의존 → 활성 탭만 재렌더 (글자크기는 CSS 변수라 불필요)
      if (!storiesView.hidden) loadStories();
      else if (!reportView.hidden) loadReport();
      else load();
    }
    themeBtn.addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      localStorage.setItem("ns_theme", next);
      syncThemeBtn();
      rerenderActiveTab();
    });
    syncThemeBtn();

    // 글자크기: 작게(.92) → 중간(1) → 크게(1.15) 순환, 현재 상태를 라벨로 표시
    const FS_PRESET = { s: ".92", m: "1", l: "1.15" };
    const FS_LABEL = { s: "가⁻", m: "가", l: "가⁺" };
    const FS_NEXT = { s: "m", m: "l", l: "s" };
    let fsKey = localStorage.getItem("ns_fs");
    if (!FS_PRESET[fsKey]) fsKey = "m";
    function applyFs() {
      document.documentElement.style.setProperty("--fs", FS_PRESET[fsKey]);
      fsBtn.textContent = FS_LABEL[fsKey];
    }
    applyFs();
    fsBtn.addEventListener("click", () => {
      fsKey = FS_NEXT[fsKey];
      localStorage.setItem("ns_fs", fsKey);
      applyFs();
    });
  </script>
</body>
</html>
