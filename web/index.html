<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>newsstore — 뉴스 피드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    // FOUC 방지: 스타일 적용 전에 저장된 테마·글자크기를 루트에 반영
    document.documentElement.dataset.theme = localStorage.getItem("ns_theme")
      || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.style.setProperty("--fs",
      { s: ".92", m: "1", l: "1.15" }[localStorage.getItem("ns_fs") || "m"]);
  </script>
  <script>
    // 부트 워치독(B5): 디폴트 첫 화면=리포트라, 모듈 import 실패(config.js 404 등)로 앱이 죽으면
    // 그게 첫 화면이 된다(solved). 정상 부팅이면 모듈이 __nsBooted=true로 이 폴백을 무력화한다.
    window.__nsBooted = false;
    setTimeout(function () {
      if (window.__nsBooted) return;
      var el = document.getElementById("reportDoc") || document.getElementById("list");
      if (el) el.innerHTML = '<div class="error">앱을 불러오지 못했습니다. 설정 또는 네트워크 문제일 수 있어요.'
        + '<br>새로고침하거나 잠시 후 다시 시도해 주세요.</div>';
    }, 8000);
  </script>
  <style>
    :root {
      --bg:#fdfcf8; --card:#fffefc; --line:#ece6da; --fg:#2f2a23;
      --sub:#4a4236; --mut:#9c9385; --accent:#c0764a; --pill:#f0ebe0; --pill-fg:#6e6558;
      --imp:#bf8f3c; --risk:#c0606d; --green:#4f9e80; --off:#ddd6c9;
      --btn:#fff; --hover:#f0f1f4; --card2:#faf9f6; --line2:#e0ddd5; --leadbg:#f3ede2;
      --headerbg:rgba(241,240,236,.94); --shadow:rgba(40,40,40,.13);
      --price:#4f6bd6;                     /* 가격 탭 정체성색(인디고 — green/red/accent와 분리) */
      --fs:1; --expand-max:min(45vh,380px);
      color-scheme:light;
    }
    :root[data-theme="dark"] {
      --bg:#191713; --card:#211e19; --line:#37322a; --fg:#ece7dd; --sub:#c9c1b2; --mut:#8a8172;
      --accent:#d98d5f; --pill:#2c2820; --pill-fg:#b3a893; --imp:#d4a959; --risk:#d97f8b;
      --green:#6cb89a; --off:#3d382e; --btn:#262219; --hover:#2e2a22; --card2:#1e1b16;
      --line2:#3a352c; --leadbg:#2a2418; --headerbg:rgba(26,24,20,.92); --shadow:rgba(0,0,0,.5);
      --price:#7d95e6;
      color-scheme:dark;
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg);
      font-family:"Inter","Noto Sans KR",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      font-size:calc(14.5px*var(--fs)); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
    header { position:sticky; top:0; z-index:5; background:var(--headerbg);
      backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:13px 16px; }
    .wrap { max-width:760px; margin:0 auto; }
    .hrow { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:0 0 9px; }
    .hbtns { display:flex; gap:6px; }
    .hbtns button { min-height:40px; min-width:40px; padding:6px 10px; line-height:1; }
    h1 { font-size:calc(18px*var(--fs)); margin:0; letter-spacing:-.2px; }
    h1 small { color:var(--mut); font-weight:400; font-size:calc(13px*var(--fs)); margin-left:6px; }
    .controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .controls label { color:var(--mut); font-size:calc(13px*var(--fs)); }
    select, button { background:var(--btn); color:var(--fg); border:1px solid var(--line);
      border-radius:8px; padding:6px 11px; font-size:calc(14px*var(--fs)); font-family:inherit; }
    button { cursor:pointer; transition:background .12s; }
    @media (hover:hover) { button:hover { background:var(--hover); } }
    #status { color:var(--mut); font-size:calc(13px*var(--fs)); margin-left:auto; }
    main { padding:13px 16px 28px; }
    .card { background:var(--card); border:1px solid var(--line); border-left-width:4px;
      border-radius:9px; padding:11px 14px; margin:0 0 6px; }
    .card.has-body { cursor:pointer; }
    .card a.title { color:var(--fg); text-decoration:none; font-size:calc(15px*var(--fs)); font-weight:600;
      line-height:1.5; letter-spacing:-.1px; }
    .excerpt { color:var(--sub); font-size:calc(13px*var(--fs)); line-height:1.6; margin:5px 0 0;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
      max-height:3.2em; transition:max-height .18s ease-out; }
    .card.open .excerpt { -webkit-line-clamp:unset; max-height:var(--expand-max); overflow:auto; }
    @media (hover:hover) {
      .card a.title:hover { color:var(--accent); }
      .card:hover { background:var(--hover); border-color:var(--line2); }
    }
    .meta { color:var(--mut); font-size:calc(12px*var(--fs)); margin-top:8px; display:flex; gap:6px;
      align-items:center; flex-wrap:wrap; }
    .pill { background:var(--pill); color:var(--pill-fg); border-radius:999px;
      padding:2px 9px; font-size:calc(11.5px*var(--fs)); }
    .src { font-weight:600; }
    .empty, .error { color:var(--mut); text-align:center; padding:44px 16px; line-height:1.7; }
    .error code { color:var(--accent); }
    @media (max-width:680px) {
      .card { padding:10px 12px; }
      .meta { row-gap:4px; }
    }

    /* ===== 탭 ===== */
    .tabs { display:flex; gap:4px; margin-bottom:9px; }
    .tab { font-weight:600; color:var(--mut); }
    .tab.active { color:var(--fg); border-color:var(--accent); box-shadow:inset 0 -2px 0 var(--accent); }
    .tabprice.active { border-color:var(--price); box-shadow:inset 0 -2px 0 var(--price); }   /* 가격 탭=인디고 */
    /* ===== 가격 탭 (값 + 차트만) ===== */
    .pcards { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; }
    .pcard { background:var(--btn); border:1px solid var(--line); border-radius:11px; padding:11px 13px; }
    .pc-h { display:flex; align-items:baseline; justify-content:space-between; gap:6px; }
    .pc-name { font-size:calc(12.5px*var(--fs)); font-weight:700; }
    .pc-sym { font-size:calc(10px*var(--fs)); color:var(--mut); font-weight:600; }
    .pc-val { font-size:calc(19px*var(--fs)); font-weight:800; margin:4px 0 1px; letter-spacing:-.3px; }
    .pc-pct { font-size:calc(12.5px*var(--fs)); font-weight:800; }
    .pc-pct.up { color:var(--green); } .pc-pct.down { color:var(--risk); } .pc-pct.flat { color:var(--mut); }
    .pspark { width:100%; height:46px; margin-top:8px; display:block; overflow:visible; }
    .pspark polyline { fill:none; stroke:var(--price); stroke-width:1.6; vector-effect:non-scaling-stroke;
      stroke-linejoin:round; stroke-linecap:round; }
    .pspark.up polyline { stroke:var(--green); } .pspark.down polyline { stroke:var(--risk); }
    .pspark-empty { height:46px; margin-top:8px; display:flex; align-items:center; justify-content:center;
      font-size:calc(10.5px*var(--fs)); color:var(--mut); }
    .pc-meta { font-size:calc(10px*var(--fs)); color:var(--mut); margin-top:6px; }
    @media (max-width:680px) { .pcards { grid-template-columns:1fr; } }
    [hidden] { display:none !important; }

    /* ===== 모바일 베이스 (토대) ===== */
    @media (max-width:680px) {
      header { padding:9px 12px; }
      h1 small { display:none; }
      main { padding:11px 12px 24px; }
    }

    /* ===== 스토리 스트립 ===== */
    .stripwrap { position:relative; }
    .strip { display:flex; align-items:flex-start; gap:9px; overflow-x:auto; padding:4px 2px 14px; scroll-behavior:smooth; }
    .strip::-webkit-scrollbar { height:7px; } .strip::-webkit-scrollbar-thumb { background:var(--line2); border-radius:8px; }
    .scard { position:relative; flex:0 0 170px; background:var(--btn); border:1px solid var(--line); border-top:3px solid var(--bar,var(--accent));
      border-radius:9px; padding:10px 12px; display:flex; flex-direction:column; gap:5px; cursor:pointer;
      transition:box-shadow .2s; }
    /* 스토리 카드 우상단 → 이 스토리의 리포트 섹션(#rep-{렌즈})으로 점프 */
    .scard .slink { position:absolute; top:6px; right:6px; width:20px; height:20px; border-radius:6px;
      display:flex; align-items:center; justify-content:center; font-size:calc(12px*var(--fs));
      color:var(--accent); background:var(--pill); text-decoration:none; line-height:1; z-index:2; }
    @media (hover:hover) { .scard .slink:hover { background:var(--accent); color:#fff; } }
    @media (hover:hover) { .scard:hover { box-shadow:0 10px 24px var(--shadow); } }
    .scard.sel { border-color:var(--accent); box-shadow:0 8px 22px var(--shadow); }
    .scard .seclbl { font-size:calc(10px*var(--fs)); font-weight:700; letter-spacing:.02em; color:var(--accent); text-transform:uppercase; margin-bottom:3px; }
    .scard .st { font-size:calc(13px*var(--fs)); font-weight:600; line-height:1.34; padding-right:20px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
    .scard .ssum { font-size:calc(11px*var(--fs)); line-height:1.45; color:var(--sub); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
    .scard .slatest { font-size:calc(10.5px*var(--fs)); color:var(--accent); font-weight:600; line-height:1.3; }
    .scard .sfoot { margin-top:auto; display:flex; gap:5px; align-items:center; }
    .scnt { background:var(--pill); color:var(--pill-fg); border-radius:999px; padding:1px 7px; font-size:calc(10px*var(--fs)); font-weight:700; }
    .stm { color:var(--mut); font-size:calc(9.5px*var(--fs)); margin-left:auto; }
    .snav { position:absolute; top:34px; width:32px; height:32px; border-radius:50%; background:var(--btn); border:1px solid var(--line);
      cursor:pointer; font-size:calc(15px*var(--fs)); color:var(--sub); display:flex; align-items:center; justify-content:center;
      box-shadow:0 3px 10px var(--shadow); z-index:4; }
    @media (hover:hover) { .snav:hover { background:var(--hover); } } .snav.l { left:-4px; } .snav.r { right:-4px; }

    /* ===== 스토리 디테일 ===== */
    .sdetail { margin:8px 0 24px; background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
    .sdetail .dt { font-size:calc(18px*var(--fs)); font-weight:700; margin:0 0 6px; }
    .sdetail .dsum { font-size:calc(13.5px*var(--fs)); color:var(--sub); line-height:1.6; margin:0 0 5px; max-width:760px; }
    .sdetail .dmeta { font-size:calc(11.5px*var(--fs)); color:var(--mut); margin-bottom:14px; }
    .dgroup { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:22px; }
    .tcol { position:relative; }
    .tcol::before { content:""; position:absolute; left:6px; top:2px; bottom:-14px; width:2px; background:var(--line2); }
    .dgroup:last-child .tcol::before { bottom:auto; height:16px; }
    .tnode { position:relative; padding:0 0 16px 20px; }
    .tdot { position:absolute; left:1px; top:3px; width:11px; height:11px; border-radius:50%; background:var(--accent); border:2px solid var(--card2); }
    .tnode.last .tdot { width:15px; height:15px; left:-1px; animation:spulse 1.8s infinite; }
    .ttime { font-size:calc(9.5px*var(--fs)); color:var(--mut); }
    .tdev { font-size:calc(13.5px*var(--fs)); font-weight:600; line-height:1.35; margin-top:2px; }
    .tcnt { font-size:calc(9.5px*var(--fs)); color:var(--mut); margin-top:3px; }
    @keyframes spulse { 0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent)}
      70%{box-shadow:0 0 0 8px color-mix(in srgb, var(--accent) 0%, transparent)}
      100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 0%, transparent)} }
    .darts { display:grid; grid-template-columns:1fr; max-width:560px; gap:8px; align-items:start; padding-bottom:16px; }
    .acard { background:var(--btn); border:1px solid var(--line); border-left-width:4px; border-radius:8px; padding:9px 12px; }
    .acard.hasx { cursor:pointer; }
    @media (hover:hover) { .acard:hover { background:var(--hover); } .acard .aat a:hover { color:var(--accent); } }
    .acard .aat a { color:var(--fg); text-decoration:none; font-size:calc(13px*var(--fs)); font-weight:600; line-height:1.4; }
    .acard .aax { font-size:calc(11.5px*var(--fs)); color:var(--sub); line-height:1.5; margin:3px 0 0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
      max-height:3.2em; transition:max-height .18s ease-out; }
    .acard.open .aax { -webkit-line-clamp:unset; max-height:var(--expand-max); overflow:auto; }
    .acard .aam { margin-top:6px; display:flex; gap:6px; align-items:center; font-size:calc(10.5px*var(--fs)); color:var(--mut); }
    .amore { align-self:center; background:var(--pill); color:var(--pill-fg); border:none; border-radius:8px; padding:7px 11px; font-size:calc(11px*var(--fs)); font-weight:600; cursor:pointer; height:fit-content; }
    @media (hover:hover) { .amore:hover { background:var(--hover); } }
    .sempty { color:var(--mut); text-align:center; padding:34px 16px; line-height:1.7; }
    @media (max-width:680px) {
      .snav { display:none; }
      .sdetail { padding:12px 12px 14px; }
      .dgroup { grid-template-columns:1fr; gap:10px; }
      .tcol::before { bottom:2px; }
      .darts { max-width:none; }
    }

    /* ===== Phase 4: 셀렉터 미터·보고서 ===== */
    .scard .sfoot { flex-wrap:wrap; gap:6px; }
    .mtr { display:inline-flex; align-items:center; gap:2px; font-size:calc(10px*var(--fs)); color:var(--mut); }
    .mtr b { font-weight:700; letter-spacing:.2px; margin-right:1px; }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--off); display:inline-block; margin-left:1px; }
    .dot.imp.on { background:var(--imp); } .dot.risk.on { background:var(--risk); }
    .delta { font-size:calc(10px*var(--fs)); font-weight:800; margin-left:3px; }
    .delta.up { color:var(--risk); } .delta.down { color:var(--mut); }
    .newb { font-size:calc(9px*var(--fs)); font-weight:800; color:#fff; background:var(--accent); padding:1px 5px; border-radius:5px; }
    .lchips { display:flex; flex-wrap:wrap; gap:4px; margin:4px 0 2px; }
    .lchip { font-size:calc(10px*var(--fs)); padding:1px 7px; border-radius:999px; background:var(--pill); color:var(--accent); font-weight:600; }
    .lchip.more { color:var(--mut); background:transparent; }
    .sdetail .dlead { font-size:calc(14px*var(--fs)); color:var(--fg); background:var(--leadbg);
      border-left:3px solid var(--accent); padding:9px 12px; border-radius:0 8px 8px 0; margin:6px 0 12px; }
    .abul { list-style:none; padding:0; margin:0 0 14px; }
    .abul li { position:relative; padding:3px 0 3px 16px; color:var(--sub); }
    .abul li::before { content:""; position:absolute; left:2px; top:11px; width:5px; height:5px; border-radius:50%; background:var(--accent); }
    .dtoggle, .htoggle { display:inline-flex; gap:2px; background:var(--pill); border-radius:7px; padding:2px; vertical-align:middle; }
    .dtoggle { margin-bottom:12px; }
    .dtoggle button, .htoggle button { border:0; background:transparent; color:var(--mut); font-weight:600;
      font-size:calc(11px*var(--fs)); padding:3px 11px; border-radius:5px; cursor:pointer; font-family:inherit; }
    .dtoggle button.on { background:var(--accent); color:#fff; } .htoggle button.on { background:var(--green); color:#fff; }
    .htoggle { margin-left:8px; }
    .times { display:flex; flex-wrap:wrap; gap:4px 8px; }
    .tp { font-size:calc(10px*var(--fs)); color:var(--mut); } .tp b { color:var(--sub); } .tp.ev b { color:var(--green); }

    /* ===== 리포트 ===== */
    /* 프레임 칩(.fchip) — 요구 9: 빨강/주황/초록 텍스트를 크고 굵게, 틴트 배경으로 가독성 확보 */
    .fchips { display:flex; flex-wrap:wrap; gap:6px; margin:2px 0 12px; }
    .fchip { font-size:calc(12.5px*var(--fs)); font-weight:700; padding:3px 10px;
      border-radius:999px; line-height:1.4; }
    .fchip.risk { color:var(--risk); background:color-mix(in srgb, var(--risk) 14%, transparent);
      border:1px solid color-mix(in srgb, var(--risk), transparent 70%); }
    .fchip.imp { color:var(--imp); background:color-mix(in srgb, var(--imp) 14%, transparent);
      border:1px solid color-mix(in srgb, var(--imp), transparent 70%); }
    .fchip.green { color:var(--green); background:color-mix(in srgb, var(--green) 14%, transparent);
      border:1px solid color-mix(in srgb, var(--green), transparent 70%); }
    /* 섹션 h4 색 액센트(.rsec-h) — 왼쪽 색 바 + 색 글자 */
    .rsec-h { font-size:calc(14px*var(--fs)); margin:14px 0 5px; padding-left:9px;
      border-left:3px solid var(--mut); color:var(--mut); }
    /* 같은 섹션 내 단락 간격 축소(2026-07-04) — 항목은 촘촘히, 섹션(h4) 사이만 벌림 */
    #reportDoc .abul { margin:0 0 8px; }
    #reportDoc .abul li { padding:2px 0 2px 14px; line-height:1.5; }
    #reportDoc .abul li::before { top:9px; }
    #reportDoc .abul li .darts { margin:3px 0 2px; gap:5px; }
    #reportDoc .dlead { margin:4px 0 8px; }
    .rsec-h.risk_triggered { border-left-color:var(--risk); color:var(--risk); }
    .rsec-h.premium_triggered { border-left-color:var(--imp); color:var(--imp); }
    .rsec-h.not_triggered { border-left-color:var(--mut); color:var(--mut); }
    .rsec-h.watchpoints { border-left-color:var(--green); color:var(--green); }
    /* 리포트 인용 카드 1열 + 폭 상한(전역 .darts 1열은 Agent C — 여기선 리포트 쪽 보장만) */
    .darts.rcards { grid-template-columns:1fr; max-width:560px; }
    /* (.scx 스토리카드 확장·.ranchors 인라인 목차 CSS는 B2/B3에서 제거 — 목차는 사이드바로, 근거는 접이식으로) */
    /* 1a 핵심 리스크 다이제스트 스트립 */
    .reprisks { border-left:4px solid var(--risk); background:color-mix(in srgb, var(--risk) 8%, transparent);
      border-radius:0 8px 8px 0; padding:10px 14px; margin:0 0 14px; }
    .reprisks-h { font-size:calc(11px*var(--fs)); font-weight:800; letter-spacing:.02em; color:var(--risk);
      text-transform:uppercase; margin-bottom:6px; }
    .reprisk { display:block; color:var(--fg); text-decoration:none; font-size:calc(13px*var(--fs));
      line-height:1.5; padding:2px 0; border-bottom:1px solid color-mix(in srgb, var(--risk) 12%, transparent); }
    .reprisk:last-of-type { border-bottom:0; }
    @media (hover:hover) { .reprisk:hover { color:var(--risk); } }
    .reprisk-more { font-size:calc(11px*var(--fs)); color:var(--mut); margin-top:4px; }
    /* #44 글로벌 시장 프레임(리포트 최상단) */
    .mktframe { background:var(--card2); border:1px solid var(--line2); border-radius:10px;
      padding:11px 14px; margin:0 0 14px; }
    .mktframe-h { font-size:calc(11px*var(--fs)); font-weight:800; letter-spacing:.02em;
      color:var(--accent); text-transform:uppercase; margin-bottom:7px; }
    /* 1c 위험 렌즈 accent(세로 스캔) */
    #reportDoc .sdetail.hot { border-left:4px solid var(--risk); }
    /* 3a achilles_kind 이중부호화(프레임 칩) */
    .fchip .ras { font-size:.85em; margin-right:2px; }
    .fchip.structural { border-style:dashed; opacity:.72; }
    .fchip .evn { font-weight:800; margin-left:3px; opacity:.7; }
    /* 2a 딥링크 스크롤 오프셋(스티키 헤더에 안 가리게) */
    #reportDoc .sdetail[id^="rep-"] { scroll-margin-top:120px; }
    @media (max-width:680px) {
      #reportDoc .sdetail { padding:12px; }
      #reportDoc .sdetail[id^="rep-"] { scroll-margin-top:96px; }
      .fchips { gap:5px; }
    }

    /* ===== B2: 글로벌 프레임 리드(백드롭 통합 — 최상단 1회) ===== */
    .mktframe-lead { font-size:calc(12.5px*var(--fs)); color:var(--fg); line-height:1.55; margin:0 0 8px; }

    /* ===== B4: divergence 재료칩 · conviction 등급(가격 정합 UI 표면) ===== */
    /* divergence = 약한 프록시 '재료'(판정 아님) — 경고색/대형 배너 금지, 파선 회색으로 위계 낮춤 */
    .divchip { font-size:calc(10.5px*var(--fs)); font-weight:600; color:var(--sub);
      background:var(--pill); border:1px dashed var(--line2); border-radius:999px;
      padding:1px 9px; vertical-align:middle; cursor:help; }
    /* conviction = 신뢰도 신호(약한 근거를 디스카운트하라) */
    .convpill { display:inline-flex; align-items:center; gap:4px; font-size:calc(10px*var(--fs));
      font-weight:700; border-radius:999px; padding:1px 8px; vertical-align:middle; cursor:help; }
    .convpill .cvdot { width:6px; height:6px; border-radius:50%; }
    .conv-high { color:var(--green); background:color-mix(in srgb, var(--green) 14%, transparent); }
    .conv-high .cvdot { background:var(--green); }
    .conv-medium { color:var(--imp); background:color-mix(in srgb, var(--imp) 14%, transparent); }
    .conv-medium .cvdot { background:var(--imp); }
    .conv-low { color:var(--mut); background:var(--pill); }
    .conv-low .cvdot { background:var(--mut); }

    /* ===== B3: 근거(기사 출처) 접이식 — 스토리 카드 대체 ===== */
    .ev-row { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:3px 0 0; }
    .ev-toggle { background:var(--pill); color:var(--pill-fg); border:1px solid var(--line);
      border-radius:999px; padding:2px 10px; font-size:calc(10.5px*var(--fs)); font-weight:600;
      cursor:pointer; line-height:1.5; font-family:inherit; }
    .ev-toggle::before { content:"▸ "; color:var(--mut); }
    .ev-toggle[aria-expanded="true"]::before { content:"▾ "; }
    @media (hover:hover) { .ev-toggle:hover { background:var(--hover); } }
    .ev-rel { font-size:calc(10px*var(--fs)); color:var(--mut); }
    .ev-body { margin:5px 0 4px; padding-left:2px; }
    .ev-cluster { margin:0 0 6px; }
    .ev-cluster-h { font-size:calc(9.5px*var(--fs)); color:var(--mut); font-weight:700; margin:0 0 3px 2px; }
    .ev-art { display:flex; gap:6px; align-items:baseline; text-decoration:none; color:var(--fg);
      padding:3px 4px; border-radius:6px; line-height:1.45; }
    @media (hover:hover) { .ev-art:hover { background:var(--hover); } .ev-art:hover .ev-title { color:var(--accent); } }
    .ev-src { flex:0 0 auto; font-size:calc(9.5px*var(--fs)); font-weight:700; border-radius:999px; padding:1px 7px; }
    .ev-title { font-size:calc(12px*var(--fs)); }
    .ev-loading, .ev-empty { font-size:calc(11px*var(--fs)); color:var(--mut); padding:4px 6px; }

    /* ===== B5: 좌측 사이드바 네비(리포트·스토리 · 스크롤스파이 · 모바일 드로어) ===== */
    .layout { display:flex; align-items:flex-start; gap:0; max-width:1180px; margin:0 auto; }
    main { flex:1 1 auto; min-width:0; }   /* min-width:0 → 자식 overflow가 레이아웃을 우측으로 밀지 않게 */
    .sidenav { flex:0 0 234px; position:sticky; top:88px; align-self:flex-start;
      max-height:calc(100vh - 96px); overflow-y:auto; padding:14px 12px 24px;
      border-right:1px solid var(--line); }
    .navsec { margin-bottom:16px; }
    .navsec-h { font-size:calc(10.5px*var(--fs)); font-weight:800; letter-spacing:.04em;
      text-transform:uppercase; color:var(--mut); margin:0 0 6px 6px; }
    .navgroup { font-size:calc(10px*var(--fs)); font-weight:700; color:var(--accent);
      margin:9px 0 3px 6px; letter-spacing:.02em; }
    .navlist .navgroup:first-child { margin-top:0; }
    .navlink { display:block; color:var(--sub); text-decoration:none; font-size:calc(12.5px*var(--fs));
      line-height:1.4; padding:5px 8px; border-radius:7px; border-left:2px solid transparent;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    @media (hover:hover) { .navlink:hover { background:var(--hover); color:var(--fg); } }
    .navlink.active { background:var(--pill); color:var(--accent); border-left-color:var(--accent); font-weight:600; }
    .navempty { font-size:calc(11px*var(--fs)); color:var(--mut); padding:4px 8px; }
    .navtoggle { display:none; }
    .navscrim { position:fixed; inset:0; background:rgba(0,0,0,.42); z-index:15; }
    @media (max-width:1000px) { .sidenav { flex-basis:186px; } }   /* 중간폭 방어: 사이드바 축소 */
    @media (min-width:681px) {                                    /* 데스크톱: 드로어 상태 강제 해제(리사이즈 잔재 방지) */
      .sidenav { transform:none !important; }
      .navscrim { display:none !important; }
    }
    @media (max-width:680px) {                                    /* 모바일: 드로어 */
      .sidenav { position:fixed; top:0; left:0; bottom:0; width:82%; max-width:300px; z-index:20;
        background:var(--card); border-right:1px solid var(--line); box-shadow:0 0 34px var(--shadow);
        max-height:none; transform:translateX(-100%); transition:transform .22s ease; padding-top:18px; }
      .sidenav.open { transform:translateX(0); }
      .navtoggle { display:inline-flex; align-items:center; justify-content:center; font-size:calc(17px*var(--fs)); }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="hrow">
        <h1>newsstore <small>5분마다 갱신되는 뉴스 피드</small></h1>
        <div class="hbtns">
          <button id="navToggle" class="navtoggle" title="네비게이션" aria-label="네비게이션 열기">☰</button>
          <button id="fsBtn" title="글자 크기 (작게/중간/크게 순환)" aria-label="글자 크기">가</button>
          <button id="themeBtn" title="배경 밝게/어둡게" aria-label="테마 전환">🌙</button>
        </div>
      </div>
      <div class="tabs">
        <button class="tab" id="tabFeed">피드</button>
        <button class="tab" id="tabStories">스토리</button>
        <button class="tab active" id="tabReport">리포트</button>
        <button class="tab tabprice" id="tabPrice">가격</button>
      </div>
      <div class="controls" id="feedControls" hidden>
        <label for="src">소스</label>
        <select id="src"><option value="__all__">전체</option></select>
        <label for="tag">태그</label>
        <select id="tag"><option value="__all__">전체</option></select>
        <button id="refresh">새로고침</button>
        <span id="status">불러오는 중…</span>
      </div>
    </div>
  </header>
  <div class="layout">
    <aside class="sidenav" id="sidenav" aria-label="리포트·스토리 네비게이션">
      <nav class="navsec">
        <div class="navsec-h">리포트</div>
        <div class="navlist" id="navReportList"><div class="navempty">불러오는 중…</div></div>
      </nav>
      <nav class="navsec">
        <div class="navsec-h">스토리</div>
        <div class="navlist" id="navStoryList"><div class="navempty">불러오는 중…</div></div>
      </nav>
    </aside>
    <main><div class="wrap">
      <div id="feedView" hidden><div id="list"></div></div>
      <div id="storiesView" hidden>
        <div class="stripwrap">
          <button class="snav l" id="snavL" aria-label="왼쪽으로">‹</button>
          <button class="snav r" id="snavR" aria-label="오른쪽으로">›</button>
          <div class="strip" id="storiesStrip"></div>
        </div>
        <div id="storiesDetail"></div>
      </div>
      <div id="reportView"><div id="reportDoc"></div></div>
      <div id="priceView" hidden><div id="priceDoc"></div></div>
    </div></main>
  </div>
  <div class="navscrim" id="navScrim" hidden></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, query, orderBy, limit, where, getDocs, doc, getDoc }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { firebaseConfig } from "./config.js";

    const listEl = document.getElementById("list");
    const statusEl = document.getElementById("status");
    const tagSel = document.getElementById("tag");
    const srcSel = document.getElementById("src");
    const seenTags = new Set();
    const db = getFirestore(initializeApp(firebaseConfig));

    // 소스명 → 고정 색 (해시 기반). 카드 왼쪽 띠 + 소스 태그.
    // 알려진 소스는 황금각(137.5°) 간격으로 색 배정 → 겹침 최소화, 미지 소스는 해시 폴백
    let SRC_ORDER = [];   // SSOT: Firestore meta/sources(=feeds.yaml에서 도출)에서 채움
    function srcColors(s) {
      const str = s || "?";
      let h, i = SRC_ORDER.indexOf(str);
      if (i >= 0) h = Math.round((i * 137.508) % 360);
      else { let x = 0; for (let j = 0; j < str.length; j++) x = (x * 31 + str.charCodeAt(j)) >>> 0; h = x % 360; }
      // 테마 인지: 다크에선 어두운 배경·밝은 글자 (테마 토글 시 활성 탭 재렌더로 반영)
      if (document.documentElement.dataset.theme === "dark")
        return { bar:`hsl(${h} 55% 50%)`, bg:`hsl(${h} 35% 22%)`, fg:`hsl(${h} 65% 80%)` };
      return { bar:`hsl(${h} 62% 54%)`, bg:`hsl(${h} 64% 95%)`, fg:`hsl(${h} 46% 32%)` };
    }
    // 피드가 이중 인코딩한 &quot; &#39; 등을 실제 문자로 디코드
    const _ta = document.createElement("textarea");
    function decode(s) { _ta.innerHTML = s || ""; return _ta.value; }
    function esc(s) {
      return (s || "").replace(/[&<>"']/g, c =>
        ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
    }
    function txt(s) { return esc(decode(s)); }
    function bodyHtml(s) { return esc(decode(s).trim()); }   // 전문; CSS가 2줄로 클램프, 카드 클릭 시 확장(.open)

    // === FEED-LOGIC-START (node test가 이 마커 사이를 슬라이스해 검증; 순수함수만, DOM/외부스코프 금지) ===
    // 노출 통제는 백엔드 kind 단일 권위(classify가 수집 시점에 박음 — story/spam/digest/sports).
    // 프론트는 목록을 복제하지 않고 'story'만 노출(비-story는 전부 숨김 — 향후 kind도 자동 숨김).
    // kind 없음(레거시·미분류)만 fail-soft 노출(분석 멈춰도 raw 뉴스 보임). SSOT=백엔드 classify.
    function keepInFeed(it) { const k = it && it.kind; return !k || k === "story"; }
    // === FEED-LOGIC-END ===
    function relTime(d) {
      if (!d) return "시간 미상";
      const s = (Date.now() - d.getTime()) / 1000;
      if (s < 60) return "방금";
      if (s < 3600) return Math.floor(s / 60) + "분 전";
      if (s < 86400) return Math.floor(s / 3600) + "시간 전";
      if (s < 7 * 86400) return Math.floor(s / 86400) + "일 전";
      return d.toLocaleDateString("ko-KR");
    }

    function refreshTagOptions(items) {
      let added = false;
      for (const it of items) for (const t of (it.tags || [])) {
        if (!seenTags.has(t)) { seenTags.add(t); added = true; }
      }
      if (!added) return;
      const cur = tagSel.value;
      tagSel.innerHTML = '<option value="__all__">전체</option>' +
        [...seenTags].sort().map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("");
      tagSel.value = cur;
    }

    function render(items) {
      if (!items.length) { listEl.innerHTML = `<div class="empty">표시할 뉴스가 없습니다.</div>`; return; }
      listEl.innerHTML = items.map(it => {
        const pub = it.published_at && it.published_at.toDate ? it.published_at.toDate() : null;
        // TruthSocial은 본문을 제목칸에 싣고 있음 → 제목은 "Truth Social", 미리보기는 그 본문
        const isTS = it.source === "TruthSocial";
        const titleHtml = isTS ? "Truth Social" : (txt(it.title) || "(제목 없음)");
        const body = bodyHtml(isTS ? (it.title || it.body) : it.body);
        const c = srcColors(it.source);
        const tags = (it.tags || []).map(t => `<span class="pill">${txt(t)}</span>`).join("");
        return `<div class="card${body ? " has-body" : ""}" style="border-left-color:${c.bar}">
          <a class="title" href="${esc(it.url)}" target="_blank" rel="noopener">${titleHtml}</a>
          ${body ? `<p class="excerpt">${body}</p>` : ""}
          <div class="meta">
            <span class="pill src" style="background:${c.bg};color:${c.fg}">${txt(it.source) || "?"}</span>
            ${it.asset_hint ? `<span class="pill">${txt(it.asset_hint)}</span>` : ""}
            ${tags}
            <span>${relTime(pub)}</span>
          </div>
        </div>`;
      }).join("");
    }

    let loadSeq = 0;                       // 응답 레이스 가드: 늦게 도착한 이전 필터 응답 폐기
    async function load(bg) {
      const seq = ++loadSeq;
      if (!bg) statusEl.textContent = "불러오는 중…";   // 4a: bg면 상태 텍스트 유지
      const tag = tagSel.value, src = srcSel.value;
      const col = collection(db, "items");
      let q;
      if (src !== "__all__")
        q = query(col, where("source", "==", src), orderBy("published_at", "desc"), limit(80));
      else if (tag !== "__all__")
        q = query(col, where("tags", "array-contains", tag), orderBy("published_at", "desc"), limit(80));
      else
        q = query(col, orderBy("published_at", "desc"), limit(80));
      try {
        const snap = await getDocs(q);
        if (seq !== loadSeq) return;                         // 더 새 요청이 나감 → 낡은 응답 버림
        const rawItems = snap.docs.map(d => d.data());
        // 제목(정규화) 기준 중복 제거 — 같은 뉴스가 URL만 달라 여러 번 들어온 경우 한 건만
        const seen = new Set(); const items = [];
        for (const it of rawItems) {
          if (!keepInFeed(it)) continue;                     // 백엔드 kind=spam/digest 숨김(SSOT)
          // 소스+태그 동시 선택: 쿼리는 소스만 걸고(복합 인덱스 회피) 태그는 클라이언트 필터
          if (src !== "__all__" && tag !== "__all__" && !(it.tags || []).includes(tag)) continue;
          const k = decode(it.title).trim().toLowerCase().replace(/\s+/g, " ");
          if (k && seen.has(k)) continue;
          if (k) seen.add(k);
          items.push(it);
        }
        if (tag === "__all__") refreshTagOptions(items);
        render(items);
        statusEl.textContent = `${items.length}건 · ${new Date().toLocaleTimeString("ko-KR")}`;
      } catch (e) {
        if (seq !== loadSeq) return;
        if (/requires an index|currently building/i.test(e.message)) {
          statusEl.textContent = "인덱스 생성 중…";
          listEl.innerHTML = `<div class="empty">소스 필터용 인덱스를 만드는 중이에요 (최초 1회, 보통 1~3분).<br>잠시 후 자동으로 다시 불러옵니다…</div>`;
          setTimeout(load, 20000);
          return;
        }
        statusEl.textContent = "";
        listEl.innerHTML = `<div class="error">불러오기 실패: <code>${esc(e.message)}</code></div>`;
      }
    }

    async function initSources() {
      try {
        const snap = await getDoc(doc(db, "meta", "sources"));
        SRC_ORDER = (snap.exists() && Array.isArray(snap.data().sources)) ? snap.data().sources : [];
      } catch (e) { SRC_ORDER = []; }
      srcSel.innerHTML = '<option value="__all__">전체 소스</option>' +
        SRC_ORDER.map(s => `<option>${esc(s)}</option>`).join("");
      load();
    }
    srcSel.addEventListener("change", load);
    tagSel.addEventListener("change", load);
    document.getElementById("refresh").addEventListener("click", load);
    // 카드 클릭 확장(패턴 E): 링크/버튼 클릭은 토글하지 않음, 본문 있는 카드만
    listEl.addEventListener("click", (e) => {
      if (e.target.closest("a,button,select")) return;
      const card = e.target.closest(".card.has-body");
      if (card) card.classList.toggle("open");
    });

    // ============================ 스토리 뷰 ============================
    const feedView = document.getElementById("feedView");
    const feedControls = document.getElementById("feedControls");
    const storiesView = document.getElementById("storiesView");
    const stripEl = document.getElementById("storiesStrip");
    const detailEl = document.getElementById("storiesDetail");
    const tabFeed = document.getElementById("tabFeed");
    const tabStories = document.getElementById("tabStories");
    let storiesLoaded = false, openStoryId = null, detailGroups = [];
    let detailMode = "translated", detailSort = "report";   // 번역/원문 · 보도순/발생순 토글 상태
    let LENS_LABELS = {}, lensLabelsLoaded = false;          // meta/lenses(렌즈 id→ko 라벨), 스토리 탭 1회 로드
    const storyById = new Map();
    const memberCache = new Map();         // story_id -> {count, items} — count가 변하면(새 멤버) 무효화

    // === STORIES-LOGIC-START (node test가 이 마커 사이를 슬라이스해 검증; 순수함수만, DOM/외부스코프 금지) ===
    function toMs(t) {
      if (t == null) return null;
      if (typeof t === "number") return t;
      if (t && typeof t.toDate === "function") return t.toDate().getTime();   // Firestore Timestamp
      if (t instanceof Date) return t.getTime();
      const n = new Date(t).getTime();
      return Number.isNaN(n) ? null : n;
    }
    function groupItemsByDevelopment(developments, items) {
      const devs = (developments || [])
        .map(d => ({ dev: d, ms: toMs(d && d.time) }))
        .filter(x => x.ms != null)
        .sort((a, b) => b.ms - a.ms);                          // 입력 순서 불신 → time DESC
      const its = (items || [])
        .map(it => ({ it, ms: toMs(it && it.published_at) }))
        .filter(x => x.ms != null)                             // null published_at 제외(backend와 동일)
        .sort((a, b) => b.ms - a.ms);                          // DESC
      if (devs.length === 0)
        return [{ dev: null, items: its.map(x => x.it) }];     // degrade: 단일 버킷
      const groups = devs.map(d => ({ dev: d.dev, ms: d.ms, items: [] }));
      for (const { it, ms } of its) {
        let chosen = groups[groups.length - 1];                // 모든 전개보다 과거 → 가장 이른 전개
        for (const g of groups) { if (g.ms <= ms) { chosen = g; break; } }  // ms 이하 중 최대(>= 경계)
        chosen.items.push(it);
      }
      return groups.map(g => ({ dev: g.dev, items: g.items }));
    }
    function pickDisplayItems(groupItems, max) {
      max = max || 2;
      const shown = [], seen = new Set();
      for (const it of groupItems) {                           // 1차: 서로 다른 source 우선
        if (shown.length >= max) break;
        const s = (it && it.source) || "";
        if (!seen.has(s)) { seen.add(s); shown.push(it); }
      }
      for (const it of groupItems) {                           // 2차: 모자라면 같은 source로 채움
        if (shown.length >= max) break;
        if (!shown.includes(it)) shown.push(it);
      }
      return { shown, moreCount: Math.max(0, groupItems.length - shown.length) };
    }
    // --- Phase 4: 정렬·delta·신선 순수함수 (라이브 도출, LLM 0콜) ---
    const IMPACT_PRIOR = 1;                 // 미채점 스토리 정렬 prior(0 매몰 방지)
    const FRESH_TAU_H = 12;                 // 신선도 감쇠 시정수(시간)
    const REF_WINDOW_MS = 24 * 3600 * 1000; // 전일대비/NEW 창
    function latestDeltaMs(s) {
      let best = null;
      for (const d of (s.developments || [])) {
        const m = toMs(d && (d.delta_time || d.time));
        if (m != null && (best == null || m > best)) best = m;
      }
      return best != null ? best : toMs(s.last_seen);
    }
    function storyRank(s, now) {
      const impact = (s.impact == null ? IMPACT_PRIOR : Number(s.impact));
      const ms = latestDeltaMs(s);
      const ageH = (now != null && ms != null) ? Math.max(0, (now - ms) / 3600000) : 1e9;
      return impact * (1 / (1 + ageH / FRESH_TAU_H));     // impact × 신선도
    }
    function deltaBadge(cur, ref, refAt, now) {
      if (cur == null || ref == null) return null;        // ref 없으면 화살표 생략(best-effort)
      if (refAt != null && now != null) {                  // §스펙: ref 신선도 게이트 — 24h 지난
        const ms = toMs(refAt);                            // stale ref로 '전일대비'를 주장하지 않는다
        if (ms == null || (now - ms) > REF_WINDOW_MS) return null;
      }
      const d = Number(cur) - Number(ref);
      if (!d) return null;
      return { dir: d > 0 ? "up" : "down", n: Math.abs(d) };
    }
    // 렌더 폴백 강등 계약(firestore-contract §stories): headline→title, lead→summary
    function displayHead(s) { return (s && (s.headline || s.title)) || ""; }
    function displayLead(s) { return (s && (s.lead || s.summary)) || ""; }
    function isNew(firstSeen, now) {
      const ms = toMs(firstSeen);
      return ms != null && (now - ms) < REF_WINDOW_MS;
    }
    function nodeTimes(dev) {
      const report = toMs(dev && dev.time);
      const ev = toMs(dev && dev.event_time);
      return { event: ev != null ? ev : report, report, eventIsActual: ev != null };
    }
    // 섹션 = 렌즈(§7): 스토리를 렌즈별로 비배타 그룹핑. 각 그룹의 메인=storyRank 최대,
    // 렌즈 순서=그룹 내 maxRisk desc(동점 메인 storyRank). 렌즈 없으면 "_etc" 버킷(드롭 금지).
    function groupStoriesByLens(stories, now) {
      const byLens = new Map();
      for (const s of (stories || [])) {
        const ids = (s.lenses && s.lenses.length) ? s.lenses : ["_etc"];
        for (const lid of ids) {
          if (!byLens.has(lid)) byLens.set(lid, []);
          byLens.get(lid).push(s);
        }
      }
      const out = [];
      for (const [lensId, arr] of byLens) {
        const sorted = [...arr].sort((a, b) => storyRank(b, now) - storyRank(a, now));
        const maxRisk = sorted.reduce((m, s) => Math.max(m, Number(s.risk) || 0), 0);
        out.push({ lensId, main: sorted[0], stories: sorted, maxRisk });
      }
      out.sort((a, b) => (b.maxRisk - a.maxRisk) || (storyRank(b.main, now) - storyRank(a.main, now)));
      return out;
    }
    // 한 스토리가 여러 렌즈의 대표로 뽑혀 같은 카드가 반복되는 것을 막는다.
    // 렌즈는 우선순위(이미 정렬됨) 순으로 처리하고, 각 스토리는 가장 앞선 렌즈에서만 대표가 된다.
    // 그 렌즈의 다음 미사용 스토리를 대표로 올리고, 남은 스토리가 없으면 그 렌즈 카드는 생략한다.
    function dedupeMains(groups) {
      const used = new Set();
      const out = [];
      for (const g of (groups || [])) {
        const main = (g.stories || []).find(s => !used.has(s.id));
        if (!main) continue;
        used.add(main.id);
        out.push({ ...g, main });
      }
      return out;
    }
    // === STORIES-LOGIC-END ===

    // === REPORT-LOGIC-START (node test가 슬라이스; 순수함수만, DOM/외부스코프 금지) ===
    const REPORT_STALE_MS = 24 * 3600 * 1000;           // §5(b) 기대 주기 1일
    function assembleReportDoc(groups, reports) {
      // 단일 데일리 문서 결정론 조립(§4): 백드롭 서두 → 첫 그룹(리스크) → 급부상 → 나머지 그룹.
      // 그룹 순서 SSOT = topics.yaml 렌즈 등장 순서(meta/report_groups로 발행), rising 위치만 UI 규칙.
      // groups는 순서 보존 배열([{name, lens_ids}]) — Firestore map 키 정렬로 순서가 깨지지 않게(m1).
      // 리포트 없는 렌즈는 생략(fail-soft — 상태는 reportStatus가 별도 판정).
      const sections = [];
      for (const g of (groups || []))
        for (const lid of (g.lens_ids || []))
          if (reports && reports[lid]) sections.push({ lensId: lid, group: g.name, report: reports[lid] });
      if (reports && reports.rising) {
        // 사용자 확정 순서(2026-07-04): rising은 첫 그룹 바로 뒤(첫 그룹 스킵 시 맨 앞)
        const firstGroup = (groups && groups.length) ? groups[0].name : null;
        let at = 0;
        while (at < sections.length && sections[at].group === firstGroup) at++;
        sections.splice(at, 0, { lensId: "rising", group: "급부상", report: reports.rising });
      }
      return { backdrop: (reports && reports._backdrop && reports._backdrop.text) || "",
               sections };
    }
    function reportStatus(report, now, skippedToday) {
      if (!report) return "not_generated";              // 스토리 부족 스킵(§4) — "아직 생성 전"
      const g = report.generated_at;
      const ms = g && typeof g.toDate === "function" ? g.toDate().getTime()
        : (g instanceof Date ? g.getTime() : new Date(g).getTime());
      const stale = !Number.isFinite(ms) || (now - ms) > REPORT_STALE_MS;
      if (stale && skippedToday) return "skipped_today"; // 오늘 런이 스토리 부족으로 스킵(§4 구분)
      if (stale) return "stale";                        // §5(b) 갱신 지연
      return "ok";
    }
    function crossLinks(sections) {
      // 같은 story_id가 여러 섹션에 인용 → {storyId: [lensId...]} (다중 인용 결정론 — §7)
      const byStory = {};
      for (const { lensId, report } of (sections || []))
        for (const sec of ((report && report.sections) || []))
          for (const it of (sec.items || []))
            for (const sid of (it.story_ids || [])) {
              if (!byStory[sid]) byStory[sid] = new Set();
              byStory[sid].add(lensId);
            }
      const out = {};
      for (const [sid, set] of Object.entries(byStory))
        if (set.size > 1) out[sid] = [...set];
      return out;
    }
    function dedupCards(storyIdOrder) {
      // 한 리포트(렌즈) 내 등장 순서에서 첫 인용만 카드(first:true), 재인용은 참조 배지.
      // 스코프=단일 리포트 — "위 카드 참조"가 다른 리포트를 가리키면 안 됨(2026-07-04 사용자 지적).
      const seen = new Set();
      return (storyIdOrder || []).map(id => {
        const first = !seen.has(id);
        seen.add(id);
        return { id, first };
      });
    }
    function topRisks(docm) {
      // 1a: 전 렌즈 risk_triggered item을 문서 순서 보존해 수집(최상단 '핵심 리스크' 다이제스트).
      // 순서·렌즈 유지(재정렬 X — SSOT 섹션순서 불변). 소비: renderReportDoc가 상단 스트립으로.
      return (docm && docm.sections || []).flatMap(({ lensId, group, report }) =>
        ((report && report.sections) || []).filter(x => x.name === "risk_triggered")
          .flatMap(x => (x.items || []).map(it => ({ lensId, group, text: it.text }))));
    }
    // B4: divergence 재료칩(#2 가격 정합 UI 표면) — A가 reports/{lens}에 발행하는 계약 소비.
    // '판정'이 아니라 약한 프록시 '재료'라 over_fear|over_hope만 노출, aligned/none/부재는 생략(fail-soft).
    function divergenceChip(divergence) {
      if (!divergence || (divergence.kind !== "over_fear" && divergence.kind !== "over_hope")) return null;
      const label = divergence.kind === "over_fear" ? "가격 정합: 과도한 공포(재료)"
                                                    : "가격 정합: 과도한 기대(재료)";
      const pct = divergence.price_pct == null ? null : Number(divergence.price_pct);
      return { label, note: divergence.note || "", price_key: divergence.price_key || "",
               price_pct: Number.isFinite(pct) ? pct : null };
    }
    // B4: conviction 등급 — 약한 근거를 디스카운트하라는 신뢰도 신호. 부재/미지 레벨은 생략(fail-soft).
    function convictionPill(conviction) {
      const LV = { high: "확신 높음", medium: "확신 중간", low: "확신 낮음" };
      if (!conviction || !LV[conviction.level]) return null;
      return { level: conviction.level, label: LV[conviction.level], basis: conviction.basis || "" };
    }
    // === REPORT-LOGIC-END ===

    // === PRICE-LOGIC-START (node test 슬라이스; 순수함수만, DOM/외부스코프 금지) ===
    // 가격 탭: 값 + 차트만(뉴스와의 정합은 별도 — 여기선 순수 시세). 순수함수만.
    function _num(v) { const n = Number(v); return Number.isFinite(n) ? n : null; }
    function pctClass(pct) { const n = _num(pct); return n == null || n === 0 ? "flat" : (n > 0 ? "up" : "down"); }
    function sparkPoints(series, w, h) {               // 시계열 close → SVG polyline points(정규화, 오래된→최신)
      const cs = (series || []).map(p => _num(p && p.c)).filter(v => v != null);
      if (cs.length < 2) return "";
      const min = Math.min(...cs), max = Math.max(...cs), rng = (max - min) || 1, step = w / (cs.length - 1);
      return cs.map((c, i) => `${(i * step).toFixed(1)},${(h - ((c - min) / rng) * h).toFixed(1)}`).join(" ");
    }
    // === PRICE-LOGIC-END ===

    async function ensureLensLabels() {
      if (lensLabelsLoaded) return;
      try {
        const snap = await getDoc(doc(db, "meta", "lenses"));
        if (snap.exists()) LENS_LABELS = snap.data() || {};
        lensLabelsLoaded = true;           // 성공 시에만 — 실패가 세션 내내 id 폴백으로 고착되지 않게
      } catch (e) { /* fail-soft: 이번 렌더는 id 폴백, 다음 로드에서 재시도 */ }
    }
    function lensChipsHtml(s, max) {                          // "기저 스토리"(렌즈) 라벨 칩
      const ids = s.lenses || [];
      if (!ids.length) return "";
      const labels = ids.map(id => LENS_LABELS[id] || id);
      const shown = max ? labels.slice(0, max) : labels;
      const more = (max && labels.length > max) ? `<span class="lchip more">+${labels.length - max}</span>` : "";
      return `<div class="lchips">${shown.map(l => `<span class="lchip">${txt(l)}</span>`).join("")}${more}</div>`;
    }
    function metersHtml(s) {
      const dot = (on, cls) => `<span class="dot ${cls}${on ? " on" : ""}"></span>`;
      const row = (label, val, ref, cls) => {
        if (val == null) return "";
        const dots = [0, 1, 2].map(i => dot(i < Number(val), cls)).join("");
        const db = deltaBadge(val, ref, s.score_ref_at, Date.now());   // stale ref 화살표 생략(신선도 게이트)
        // delta 화살표 색을 해당 지표(imp|risk) 색으로 상속 — up=risk색 오독 방지(색-의미 일관)
        const badge = db ? `<span class="delta ${db.dir}" style="color:var(--${cls})">${db.dir === "up" ? "▲" : "▼"}${db.n}</span>` : "";
        return `<span class="mtr"><b style="color:var(--${cls})">${label}</b>${dots}${badge}</span>`;
      };
      return row("impact", s.impact, s.impact_ref, "imp") + row("risk", s.risk, s.risk_ref, "risk");
    }
    function storyCardHtml(s, lensLabel) {
      const c = srcColors(s.id);
      const head = txt(displayHead(s)) || "(제목 없음)";
      const last = s.last_seen && s.last_seen.toDate ? s.last_seen.toDate() : null;
      const newb = isNew(s.first_seen, Date.now()) ? `<span class="newb">NEW</span>` : "";
      const sec = lensLabel ? `<div class="seclbl">${txt(lensLabel)}</div>` : "";
      // 우상단 링크: 이 스토리의 리포트 섹션으로 점프(#rep-{첫 렌즈}). 렌즈 없으면 생략(fail-soft).
      const rep = `<a class="slink" href="#story-${esc(s.id)}" title="이 스토리 상세로" aria-label="스토리 상세로">↗</a>`;
      return `<div class="scard" data-id="${esc(s.id)}" style="--bar:${c.bar}">${rep}
        ${sec}<div class="st">${head}</div>${lensChipsHtml(s, 2)}
        <div class="sfoot"><span class="scnt">${Number(s.count) || 0}건</span>
          ${metersHtml(s)}${newb}<span class="stm">${relTime(last)}</span></div></div>`;
    }
    function articleCardHtml(it) {
      const pub = it.published_at && it.published_at.toDate ? it.published_at.toDate() : null;
      const isTS = it.source === "TruthSocial";
      const titleHtml = isTS ? "Truth Social" : (txt(it.title) || "(제목 없음)");
      const body = bodyHtml(isTS ? (it.title || it.body) : it.body);
      const c = srcColors(it.source);
      return `<article class="acard${body ? " hasx" : ""}" style="border-left-color:${c.bar}">
        <div class="aat"><a href="${esc(it.url)}" target="_blank" rel="noopener">${titleHtml}</a></div>
        ${body ? `<p class="aax">${body}</p>` : ""}
        <div class="aam"><span class="pill src" style="background:${c.bg};color:${c.fg}">${txt(it.source) || "?"}</span>
          <span>${relTime(pub)}</span></div></article>`;
    }
    function fmtTime(ms) {
      return ms == null ? "" : new Date(ms).toLocaleString("ko-KR",
        { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
    }
    function bulletsHtml(article) {
      if (!Array.isArray(article) || !article.length) return "";
      return `<ul class="abul">${article.map(b => `<li>${txt(b)}</li>`).join("")}</ul>`;
    }
    function renderDetail(s, items) {
      let groups = groupItemsByDevelopment(s.developments || [], items);
      if (detailSort === "event")                       // 발생순: event_time(폴백 time) DESC
        groups = [...groups].sort((a, b) =>
          (b.dev ? nodeTimes(b.dev).event : 0) - (a.dev ? nodeTimes(a.dev).event : 0));
      detailGroups = groups;
      const head = txt(displayHead(s)) || "(제목 없음)";
      const lead = displayLead(s);
      const meta = `${Number(s.count) || items.length}개 기사 · ${groups.filter(g => g.dev).length}개 전개`;
      const toggle = `<div class="dtoggle">
        <button data-m="translated" class="${detailMode === 'translated' ? 'on' : ''}">번역</button>
        <button data-m="original" class="${detailMode === 'original' ? 'on' : ''}">원문</button></div>`;
      const sortT = `<span class="htoggle">
        <button data-s="report" class="${detailSort === 'report' ? 'on' : ''}">보도순</button>
        <button data-s="event" class="${detailSort === 'event' ? 'on' : ''}">발생순</button></span>`;
      const rows = groups.map((g, gi) => {
        const isDev = !!g.dev;
        const nt = isDev ? nodeTimes(g.dev) : null;
        const devText = isDev ? txt(g.dev.text) : "전체 기사";
        const times = isDev ? `<span class="tp ev">발생 <b>${fmtTime(nt.event)}</b>${nt.eventIsActual ? "" : " (보도기준)"}</span>
          <span class="tp">보도 <b>${fmtTime(nt.report)}</b></span>` : "";
        const { shown, moreCount } = pickDisplayItems(g.items, detailMode === "original" ? 99 : 2);
        const arts = (shown.map(articleCardHtml).join("") || `<div class="sempty">기사 없음</div>`) +
          (moreCount > 0 ? `<button class="amore" data-gi="${gi}">+${moreCount}개 더</button>` : "");
        return `<div class="dgroup"><div class="tcol"><div class="tnode ${gi === 0 ? "last" : ""}">
          <span class="tdot"></span><div class="times">${times}</div>
          <div class="tdev">${devText}</div></div></div>
          <div class="darts" data-gi="${gi}">${arts}</div></div>`;
      }).join("");
      detailEl.innerHTML = `<div class="sdetail">
        <div class="dt">${head}</div>
        ${detailMode === "translated" && lead ? `<div class="dlead">${txt(lead)}</div>` : ""}
        ${lensChipsHtml(s)}
        ${detailMode === "translated" ? bulletsHtml(s.article) : ""}
        ${toggle}<div class="dmeta">${meta} ${sortT}</div>
        ${rows || '<div class="sempty">표시할 기사가 없습니다.</div>'}</div>`;
    }
    function closeDetail() {
      openStoryId = null; detailEl.innerHTML = "";
      [...stripEl.querySelectorAll(".scard")].forEach(c => c.classList.remove("sel"));
    }
    let pendingStoryId = null;                                 // #story-{id} 딥링크: 로드 후 열 스토리
    async function openStory(id) {
      if (openStoryId === id) { closeDetail(); return; }       // 토글
      openStoryId = id;
      [...stripEl.querySelectorAll(".scard")].forEach(c => c.classList.toggle("sel", c.dataset.id === id));
      detailEl.innerHTML = `<div class="sdetail"><div class="sempty">불러오는 중…</div></div>`;
      let s = storyById.get(id);
      if (!s) {                                                // 딥링크: 리포트 인용 스토리가 스트립 top-40 밖일 수 있음 → 직접 fetch
        try {
          const snap = await getDoc(doc(db, "stories", id));
          if (snap.exists()) { s = { id: snap.id, ...snap.data() }; storyById.set(id, s); }
        } catch (e) { /* fail-soft */ }
        if (openStoryId !== id) return;
      }
      if (!s) { detailEl.innerHTML = `<div class="sdetail"><div class="sempty">스토리를 찾을 수 없어요.</div></div>`; return; }
      const cached = memberCache.get(id);
      let items = (cached && cached.count === (Number(s.count) || 0)) ? cached.items : null;
      if (!items) {
        try {
          const qs = query(collection(db, "items"), where("story_id", "==", id), orderBy("published_at"));
          items = (await getDocs(qs)).docs.map(d => d.data());
          memberCache.set(id, { count: Number(s.count) || 0, items });
        } catch (err) {
          if (openStoryId === id)
            detailEl.innerHTML = `<div class="sdetail"><div class="sempty">기사 불러오기 실패: <code>${esc(err.message)}</code></div></div>`;
          return;
        }
      }
      if (openStoryId !== id) return;                          // 사용자가 다른 카드로 이동
      renderDetail(s, items);
    }
    async function loadStories(bg) {
      if (!bg) { detailEl.innerHTML = ""; openStoryId = null;   // 4a: bg면 상세·상태 안 건드림
        stripEl.innerHTML = `<div class="sempty">불러오는 중…</div>`; }
      await ensureLensLabels();
      try {
        const q2 = query(collection(db, "stories"), where("status", "==", "open"),
                         orderBy("last_seen", "desc"), limit(40));
        const all = (await getDocs(q2)).docs.map(d => ({ id: d.id, ...d.data() }));
        const now = Date.now();
        const visible = all.filter(s => (Number(s.count) || 0) >= 2);            // 멤버 2+
        const groups = dedupeMains(groupStoriesByLens(visible, now));            // 섹션=렌즈(maxRisk순), 같은 스토리 중복 카드 제거
        storyById.clear(); visible.forEach(s => storyById.set(s.id, s));
        if (!groups.length) {
          stripEl.innerHTML = `<div class="sempty">아직 묶인 스토리가 없어요.<br>기사가 쌓이면 자동으로 묶여 나타납니다.</div>`;
          buildStoryNav([]);                                     // B5: 사이드바 스토리 목록(빈)
          return;
        }
        const lensLabel = g => LENS_LABELS[g.lensId] || (g.lensId === "_etc" ? "기타" : g.lensId);
        stripEl.innerHTML = groups.map(g => storyCardHtml(g.main, lensLabel(g))).join("");   // 섹션별 메인 1개
        buildStoryNav(groups);                                   // B5: 사이드바 스토리 목록
        if (pendingStoryId) {                                  // #story-{id} 딥링크 대기분 열기(openStory가 없으면 직접 fetch)

          openStory(t);
        }
      } catch (e) {
        if (/requires an index|currently building/i.test(e.message)) {
          stripEl.innerHTML = `<div class="sempty">스토리 인덱스를 만드는 중이에요(최초 1회, 보통 1~3분)…</div>`;
          setTimeout(loadStories, 20000); return;
        }
        stripEl.innerHTML = `<div class="sempty">불러오기 실패: <code>${esc(e.message)}</code></div>`;
      }
    }

    stripEl.addEventListener("click", e => {
      if (e.target.closest("a")) return;                       // 링크(↗ 리포트로)는 카드 열기 트리거 X
      const card = e.target.closest(".scard");
      if (card) openStory(card.dataset.id);
    });
    detailEl.addEventListener("click", e => {
      const mt = e.target.closest(".dtoggle button");         // 번역/원문 토글
      if (mt) { detailMode = mt.dataset.m;
        const s = storyById.get(openStoryId); if (s) renderDetail(s, (memberCache.get(openStoryId) || {}).items || []); return; }
      const stog = e.target.closest(".htoggle button");       // 보도순/발생순 토글
      if (stog) { detailSort = stog.dataset.s;
        const s = storyById.get(openStoryId); if (s) renderDetail(s, (memberCache.get(openStoryId) || {}).items || []); return; }

      const ac = e.target.closest(".acard.hasx");             // 기사 카드 본문 클릭 확장 (패턴 E)
      if (ac) ac.classList.toggle("open");
    });
    stripEl.addEventListener("wheel", e => {                  // 세로 휠 → 가로 스크롤
      if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { stripEl.scrollLeft += e.deltaY; e.preventDefault(); }
    }, { passive: false });
    document.getElementById("snavL").addEventListener("click", () => stripEl.scrollBy({ left: -360, behavior: "smooth" }));
    document.getElementById("snavR").addEventListener("click", () => stripEl.scrollBy({ left: 360, behavior: "smooth" }));
    document.addEventListener("keydown", e => { if (e.key === "Escape" && openStoryId) closeDetail(); });

    // ============================ 리포트 뷰 ============================
    const reportView = document.getElementById("reportView");
    const reportDocEl = document.getElementById("reportDoc");
    const tabReport = document.getElementById("tabReport");
    let reportLoaded = false;

    // 네트워크 행(무한 대기) 방어: 리포트가 디폴트 첫 화면이라 read가 멈추면 '불러오는 중'이 영구 고착된다.
    // 부트 워치독은 모듈 import 실패만 커버 — 이건 정상 부팅 후 read 자체가 안 끝나는 경우를 에러로 승격한다.
    function withTimeout(promise, ms) {
      let t;
      const timer = new Promise((_, rej) => {
        t = setTimeout(() => rej(new Error("네트워크 응답이 지연되고 있어요. 연결을 확인하고 다시 시도해 주세요.")), ms);
      });
      return Promise.race([promise, timer]).finally(() => clearTimeout(t));
    }

    async function loadReport(bg) {
      if (!bg) reportDocEl.innerHTML = `<div class="sempty">불러오는 중…</div>`;   // 4a: bg면 깜빡임 없음
      await ensureLensLabels();
      try {
        const [repSnap, frameSnap, groupsSnap] = await withTimeout(Promise.all([
          getDocs(collection(db, "reports")), getDocs(collection(db, "frames")),
          getDoc(doc(db, "meta", "report_groups"))]), 15000);
        const reports = {}; repSnap.docs.forEach(d => reports[d.id] = d.data());
        const frames = {}; frameSnap.docs.forEach(d => frames[d.id] = d.data());
        const groups = groupsSnap.exists() ? ((groupsSnap.data() || {}).groups || []) : [];
        // _skips는 그룹 렌즈 id가 아니므로 assembleReportDoc(그룹 id 키잉)에서 자동 배제된다(M5)
        const skips = (reports._skips && reports._skips.lenses) || [];
        const docm = assembleReportDoc(groups, reports);
        buildReportNav(docm);                          // B5: 사이드바 리포트 목차(빈 문서면 '리포트 없음')
        if (!docm.sections.length) {
          reportDocEl.innerHTML = `<div class="sempty">아직 생성된 리포트가 없어요.<br>매일 아침 자동 생성됩니다.</div>`;
          return;
        }
        const now = Date.now();
        const links = crossLinks(docm.sections);
        // B3: 초기 렌더는 items/스토리 문서를 전혀 fetch하지 않는다(0). 근거 기사는 토글 펼칠 때 lazy.
        renderReportDoc(docm, frames, links, now, skips);
        setupReportSpy();                              // B5: 스크롤 스파이(현재 섹션 하이라이트)
        // 2a: async 렌더 완료 후 딥링크(#rep-*) 재스크롤 — 네이티브 앵커는 섹션 렌더 전 헛돎.
        const h = location.hash;
        if (h.startsWith("#rep-")) document.getElementById(h.slice(1))?.scrollIntoView({ block: "start" });
      } catch (e) {
        reportLoaded = false;                          // 고착 방지: 탭 재진입/‘다시 시도’로 재로드되게
        reportDocEl.innerHTML = `<div class="error">리포트를 불러오지 못했어요: <code>${esc(e.message)}</code>`
          + `<br><button class="retry-report" type="button" style="margin-top:10px">다시 시도</button></div>`;
      }
    }

    const SEC_LABEL = { risk_triggered: "아킬레스건 트리거", premium_triggered: "기대 트리거",
                        not_triggered: "미발생", watchpoints: "주시 포인트" };
    function frameChipsHtml(f) {
      if (!f) return "";
      // 3a: achilles_kind 이중부호화 — words_deeds(RAS 말-행동 괴리)는 ⚡ + 근거건수, structural은 파선.
      const ax = (arr, cls) => (arr || []).map(p => {
        const kind = p.achilles_kind, evN = (p.evidence_dev_ids || []).length;
        const ras = kind === "words_deeds" ? `<span class="ras" aria-label="말-행동 괴리">⚡</span>` : "";
        const evn = evN ? `<sup class="evn">${evN}</sup>` : "";
        const title = kind === "words_deeds" ? `말-행동 괴리(RAS) · 근거 ${evN}건`
          : kind === "structural" ? "구조적 이월" : esc(p.id || "");
        return `<span class="fchip ${cls}${kind === "structural" ? " structural" : ""}" title="${esc(title)}">${ras}${txt(p.text)}${evn}</span>`;
      }).join("");
      return `<div class="fchips">${ax(f.risks, "risk")}${ax(f.premiums, "imp")}${ax(f.watchpoints, "green")}</div>`;
    }
    function tsToMs(v) {
      if (!v) return null;
      if (typeof v.toDate === "function") return v.toDate().getTime();
      const n = new Date(v).getTime();
      return Number.isFinite(n) ? n : null;
    }
    function renderReportDoc(docm, frames, links, now, skips) {
      const body = docm.sections.map(({ lensId, group, report }) => {
        const rc = (report.sections || []).filter(x => x.name === "risk_triggered")   // 1c: 아킬레스 트리거 수
          .reduce((n, x) => n + ((x.items || []).length), 0);
        const st = reportStatus(report, now, (skips || []).includes(lensId));
        const badge = report.review && report.review.passed === false
          ? `<span class="newb" style="background:var(--risk)" title="${esc((report.review.notes || "").slice(0, 300))}">검증 실패</span>` : "";
        // "오늘 스토리 부족"(오늘 런이 스킵) vs "갱신 지연"(런 자체가 늦음)을 구분(M5 — §4)
        const stale = st === "stale" ? `<span class="newb" style="background:var(--mut)">갱신 지연</span>`
          : st === "skipped_today" ? `<span class="newb" style="background:var(--mut)">오늘 스토리 부족</span>` : "";
        // §5(c)·§7: 프레임 자체가 낡았거나(updated_at 1일+), 본문이 참조한 판과 현행 판이 다르면 표기
        const f = frames[lensId];
        const fMs = tsToMs(f && f.updated_at);
        const frameStale = fMs != null && (now - fMs) > REPORT_STALE_MS
          ? `<span class="newb" style="background:var(--mut)">프레임 갱신 지연</span>` : "";
        const refMs = tsToMs(report.frame_updated_at);
        const skew = (fMs != null && refMs != null && fMs !== refMs)
          ? `<span class="pill">본문은 이전 프레임 기준</span>` : "";
        // B4: divergence 재료칩 + conviction 등급(A 계약 소비 — 필드 부재 시 조용히 생략)
        const dv = divergenceChip(report.divergence);
        const divHtml = dv
          ? `<span class="divchip" title="${esc(dv.note)}">${txt(dv.label)}${dv.price_pct != null
              ? ` · ${dv.price_key ? esc(dv.price_key) + " " : ""}${dv.price_pct > 0 ? "+" : ""}${dv.price_pct}%` : ""}</span>` : "";
        const cv = convictionPill(report.conviction);
        const convHtml = cv
          ? `<span class="convpill conv-${esc(cv.level)}" title="${esc(cv.basis)}"><span class="cvdot"></span>${txt(cv.label)}</span>` : "";
        const secs = (report.sections || []).map(sec => {
          const items = (sec.items || []).map(it => {
            // B3: 스토리 카드 제거 → 항목당 '근거 N건' 접이식(기본 접힘). 펼칠 때 story_ids의 items lazy fetch.
            const sids = (it.story_ids || []).filter(Boolean);
            const rel = [...new Set(sids.flatMap(sid => (links[sid] || []).filter(l => l !== lensId)))]
              .map(l => LENS_LABELS[l] || l);
            const relHtml = rel.length ? `<span class="ev-rel">관련: ${txt(rel.join(", "))}</span>` : "";
            const evRow = sids.length
              ? `<div class="ev-row"><button class="ev-toggle" type="button" aria-expanded="false" data-sids="${esc(sids.join(","))}">근거 ${sids.length}건</button>${relHtml}</div><div class="ev-body" hidden></div>`
              : "";
            return `<li>${txt(it.text)}${evRow}</li>`;
          }).join("");
          return items ? `<h4 class="rsec-h ${esc(sec.name || "")}">${SEC_LABEL[sec.name] || esc(sec.name)}</h4><ul class="abul">${items}</ul>` : "";
        }).join("");
        const gen = tsToMs(report.generated_at);
        const hot = rc ? `<span class="newb" style="background:var(--risk)">아킬레스 ${rc}</span>` : "";
        return `<section class="sdetail${rc ? " hot" : ""}" id="rep-${esc(lensId)}">
          <div class="seclbl">${txt(group)} · ${txt(LENS_LABELS[lensId] || lensId)}</div>
          <div class="dt">${txt(report.headline) || "(제목 없음)"} ${hot}${convHtml}${divHtml}${badge}${stale}${frameStale}${skew}</div>
          <div class="dlead">${txt(report.lead)}</div>
          ${secs}
          <div class="dmeta">${relTime(gen != null ? new Date(gen) : null)} · 가격 미반영(이슈 중심)</div>
        </section>`;
      }).join("");
      // 1a: 최상단 '핵심 리스크' 다이제스트 — 전 렌즈 아킬레스 트리거를 요약, 클릭 시 해당 렌즈로.
      const tr = topRisks(docm);
      const digest = tr.length
        ? `<div class="reprisks"><div class="reprisks-h">지금 시장이 두려워하는 것</div>` +
          tr.slice(0, 7).map(r =>
            `<a href="#rep-${esc(r.lensId)}" class="reprisk">${txt(r.text)}</a>`).join("") +
          (tr.length > 7 ? `<div class="reprisk-more">+${tr.length - 7}개 더 (아래 섹션)</div>` : "") +
          `</div>` : "";
      // B2: 글로벌 시장 프레임(frames/_market) + 백드롭을 리포트 최상단 1회로 통합.
      //     backdrop은 렌즈마다 반복하지 않고 이 글로벌 블록의 리드로만 노출(렌즈 반복 제거).
      const mkt = frames["_market"];
      const mktChips = (mkt && ((mkt.risks || []).length || (mkt.premiums || []).length)) ? frameChipsHtml(mkt) : "";
      const globalBlock = (mktChips || docm.backdrop)
        ? `<div class="mktframe"><div class="mktframe-h">글로벌 시장 프레임 — 전 자산군을 꿰는 공포·기대</div>`
          + (docm.backdrop ? `<div class="mktframe-lead">${txt(docm.backdrop)}</div>` : "") + mktChips + `</div>`
        : "";
      reportDocEl.innerHTML = globalBlock + digest + body;
    }

    // B3: 근거(기사 출처) lazy fetch — story_id별 Promise 메모이즈.
    // 재펼침·여러 항목이 같은 story_id 인용·동시 펼침 모두 단일 fetch로 수렴(N+1 read 차단).
    // 실패 시 캐시에서 제거해 재시도 허용(성공만 캐시). 초기 렌더 fetch 0.
    const reportItemsCache = new Map();   // story_id -> Promise<items[]>
    function fetchStoryItems(sid) {
      if (!reportItemsCache.has(sid)) {
        reportItemsCache.set(sid,
          getDocs(query(collection(db, "items"), where("story_id", "==", sid), orderBy("published_at")))
            .then(qs => qs.docs.map(d => d.data()))
            .catch(err => { reportItemsCache.delete(sid); throw err; }));
      }
      return reportItemsCache.get(sid);
    }
    function evArticleHtml(it) {                        // 출처=기사 원문(스토리 문서 아님) — 제목+url 링크
      const isTS = it.source === "TruthSocial";
      const title = isTS ? "Truth Social" : (txt(it.title) || "(제목 없음)");
      const c = srcColors(it.source);
      return `<a class="ev-art" href="${esc(it.url)}" target="_blank" rel="noopener">
        <span class="ev-src" style="background:${c.bg};color:${c.fg}">${txt(it.source) || "?"}</span>
        <span class="ev-title">${title}</span></a>`;
    }
    reportDocEl.addEventListener("click", async e => {
      if (e.target.closest(".retry-report")) { loadReport(); return; }   // 로드 실패 후 재시도
      const btn = e.target.closest(".ev-toggle");
      if (!btn) return;
      const body = btn.closest(".ev-row").nextElementSibling;   // .ev-body
      if (!body) return;
      if (!body.hasAttribute("hidden")) {                       // 접기
        body.setAttribute("hidden", ""); btn.setAttribute("aria-expanded", "false"); return;
      }
      body.removeAttribute("hidden"); btn.setAttribute("aria-expanded", "true");
      if (body.dataset.loaded) return;                          // 이미 렌더 — 재fetch 안 함(캐시가 있어도 DOM 재사용)
      body.dataset.loaded = "1";
      body.innerHTML = `<div class="ev-loading">근거 불러오는 중…</div>`;
      const sids = (btn.dataset.sids || "").split(",").filter(Boolean);
      try {
        const clusters = await Promise.all(sids.map(async sid => ({ items: await fetchStoryItems(sid) })));
        const multi = clusters.length > 1;                      // 여러 클러스터면 story_id별 얇은 소제목으로 묶음
        body.innerHTML = clusters.map(({ items }) => {
          const arts = items.map(evArticleHtml).join("") || `<div class="ev-empty">기사 없음</div>`;
          const h = multi ? `<div class="ev-cluster-h">${items.length}개 기사</div>` : "";
          return `<div class="ev-cluster">${h}${arts}</div>`;
        }).join("");
      } catch (err) {
        body.dataset.loaded = "";                               // 재시도 허용
        body.innerHTML = `<div class="ev-empty">근거 불러오기 실패: <code>${esc(err.message)}</code></div>`;
      }
    });

    // ============================ 사이드바 네비 (B5) ============================
    const sidenav = document.getElementById("sidenav");
    const navReportList = document.getElementById("navReportList");
    const navStoryList = document.getElementById("navStoryList");
    const navScrim = document.getElementById("navScrim");
    const navToggle = document.getElementById("navToggle");

    // 리포트 목차 = 그룹→렌즈(SSOT: docm.sections 순서 = topics.yaml report_group). 하드코딩 복제 없음.
    function buildReportNav(docm) {
      let html = "", lastGroup = null;
      for (const { lensId, group } of ((docm && docm.sections) || [])) {
        if (group !== lastGroup) { html += `<div class="navgroup">${txt(group)}</div>`; lastGroup = group; }
        html += `<a href="#rep-${esc(lensId)}" data-lens="${esc(lensId)}" class="navlink">${txt(LENS_LABELS[lensId] || lensId)}</a>`;
      }
      navReportList.innerHTML = html || `<div class="navempty">리포트 없음</div>`;
    }
    function buildStoryNav(groups) {
      navStoryList.innerHTML = ((groups || []).map(g =>
        `<a href="#story-${esc(g.main.id)}" data-story="${esc(g.main.id)}" class="navlink">${txt(displayHead(g.main)) || "(제목 없음)"}</a>`).join(""))
        || `<div class="navempty">스토리 없음</div>`;
    }
    // 스크롤 스파이: 현재 화면 상단에 걸린 리포트 섹션의 사이드바 링크를 하이라이트.
    let reportSpy = null;
    function cssEsc(s) { return (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/["\\\]]/g, "\\$&"); }
    function setupReportSpy() {
      if (reportSpy) { reportSpy.disconnect(); reportSpy = null; }
      const secs = [...reportDocEl.querySelectorAll('section[id^="rep-"]')];
      if (!secs.length || typeof IntersectionObserver === "undefined") return;
      reportSpy = new IntersectionObserver(entries => {
        for (const en of entries) {
          if (!en.isIntersecting) continue;
          const lid = en.target.id.slice(4);                    // "rep-".length === 4
          navReportList.querySelectorAll(".navlink.active").forEach(a => a.classList.remove("active"));
          const link = navReportList.querySelector(`.navlink[data-lens="${cssEsc(lid)}"]`);
          if (link) link.classList.add("active");
        }
      }, { rootMargin: "-110px 0px -68% 0px" });
      secs.forEach(s => reportSpy.observe(s));
    }
    function closeDrawer() { sidenav.classList.remove("open"); navScrim.hidden = true; }
    navToggle.addEventListener("click", () => { navScrim.hidden = !sidenav.classList.toggle("open"); });
    navScrim.addEventListener("click", closeDrawer);
    sidenav.addEventListener("click", e => { if (e.target.closest("a")) closeDrawer(); });  // 링크→드로어 닫힘(hashchange가 라우팅)
    matchMedia("(min-width:681px)").addEventListener("change", e => { if (e.matches) closeDrawer(); });  // 데스크톱 진입 시 드로어 상태 초기화(리사이즈 잔재 방지)

    // ============================ 가격 뷰 ============================
    const priceView = document.getElementById("priceView");
    const priceDocEl = document.getElementById("priceDoc");
    const tabPrice = document.getElementById("tabPrice");
    let priceLoaded = false;

    function fmtClose(close, currency) {
      const n = Number(close);
      if (!Number.isFinite(n)) return "—";
      try { return new Intl.NumberFormat("ko-KR",
        { maximumFractionDigits: currency === "KRW" ? 0 : 2 }).format(n); }
      catch (e) { return String(n); }
    }
    function pctStr(pct) {
      const n = Number(pct); if (!Number.isFinite(n)) return "—";
      const c = pctClass(n); return `${c === "up" ? "▲" : c === "down" ? "▼" : "·"}${Math.abs(n).toFixed(2)}%`;
    }
    async function loadPrices(bg) {
      if (!bg) priceDocEl.innerHTML = `<div class="sempty">불러오는 중…</div>`;
      try {
        const snap = await getDocs(collection(db, "prices"));
        const prices = {}; snap.docs.forEach(d => prices[d.id] = d.data());
        if (!Object.keys(prices).length) {
          priceDocEl.innerHTML = `<div class="sempty">가격 데이터 준비 중이에요.</div>`;
          return;
        }
        renderPriceDashboard(prices);
      } catch (e) {
        priceDocEl.innerHTML = `<div class="sempty">불러오기 실패: <code>${esc(e.message)}</code></div>`;
      }
    }
    function renderPriceDashboard(prices) {
      // 값 + 차트만. 뉴스와의 정합(over/under-reaction)은 별도 — 여기선 순수 시세.
      const cards = Object.entries(prices).map(([key, p]) => {
        const cls = pctClass(p.percent_change);
        const pts = sparkPoints(p.series, 220, 46);
        const chart = pts
          ? `<svg class="pspark ${cls}" viewBox="0 0 220 46" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}"/></svg>`
          : `<div class="pspark-empty">차트 준비 중</div>`;
        return `<div class="pcard">
          <div class="pc-h"><span class="pc-name">${txt(p.label || key)}</span><span class="pc-sym">${esc(p.symbol || "")}</span></div>
          <div class="pc-val">${fmtClose(p.close, p.currency)}</div>
          <div class="pc-pct ${cls}">${pctStr(p.percent_change)}</div>
          ${chart}
          <div class="pc-meta">${p.datetime ? esc(String(p.datetime)) : ""}${p.currency ? " · " + esc(p.currency) : ""}</div></div>`;
      }).join("");
      priceDocEl.innerHTML = `<div class="pcards">${cards}</div>`;
    }

    function showTab(which) {
      const stories = which === "stories", report = which === "report", price = which === "price";
      const feed = !stories && !report && !price;
      feedView.hidden = !feed; feedControls.hidden = !feed;
      storiesView.hidden = !stories; reportView.hidden = !report; priceView.hidden = !price;
      tabFeed.classList.toggle("active", feed);
      tabStories.classList.toggle("active", stories);
      tabReport.classList.toggle("active", report);
      tabPrice.classList.toggle("active", price);
      if (stories && !storiesLoaded) { storiesLoaded = true; loadStories(); }
      if (report && !reportLoaded) { reportLoaded = true; loadReport(); }
      if (price && !priceLoaded) { priceLoaded = true; loadPrices(); }
    }
    function routeFromHash() {
      // #rep-* 는 리포트 문서 내 섹션 앵커 — 리포트 탭을 유지해야 브라우저 기본 스크롤이 동작(M1)
      const h = location.hash;
      if (h.startsWith("#story-")) {                           // 스토리 딥링크 → 스토리 탭 + 상세 열기
        const id = h.slice(7);
        showTab("stories");
        if (storiesLoaded) { if (openStoryId !== id) openStory(id); }   // openStory가 storyById 없으면 직접 fetch
        else pendingStoryId = id;                              // 로드 전이면 loadStories 끝에서 연다
        return;
      }
      showTab(h === "#stories" ? "stories"
        : (h === "#report" || h.startsWith("#rep-")) ? "report"
        : h === "#price" ? "price"
        : h === "#feed" ? "feed"
        : "report");                                             // B5: 디폴트 첫 화면 = 리포트(빈/미지 해시)
    }
    tabFeed.addEventListener("click", () => { location.hash = "#feed"; });
    tabStories.addEventListener("click", () => { location.hash = "#stories"; });
    tabReport.addEventListener("click", () => { location.hash = "#report"; });
    tabPrice.addEventListener("click", () => { location.hash = "#price"; });
    window.addEventListener("hashchange", routeFromHash);

    initSources();
    routeFromHash();
    window.__nsBooted = true;      // B5: 모듈이 여기까지 실행됨 → 부트 워치독 폴백 무력화(import 실패만 폴백 발동)
    // B5: 디폴트가 리포트라 스토리 탭을 안 열면 사이드바 스토리 목록이 안 채워진다.
    // 스토리를 1회 백그라운드 로드해 목차를 완성한다(storiesLoaded=true로 탭 방문 시 중복 로드 방지).
    if (!storiesLoaded) { storiesLoaded = true; loadStories(true); }

    // 자동경신: 5분마다 활성 탭 데이터 재로드(헤더 "5분마다 갱신" 약속 이행).
    // 스토리 상세를 연 상태면 스토리 재로드 스킵(사용자 방해 방지), 백그라운드 탭이면 스킵(불필요한 read 절감).
    const AUTO_REFRESH_MS = 5 * 60 * 1000;
    setInterval(() => {
      if (document.hidden) return;
      // 4a: 깜빡임 없는 bg 갱신 + 펼친 카드가 있으면 스킵(사용자 방해 방지).
      // 4b: 리포트는 4×/일 생성이라 5분 폴링 제거(탭 재진입 시 갱신) — 낭비 read 절감.
      if (!storiesView.hidden) {
        if (!openStoryId && !stripEl.querySelector(".scard.open")) loadStories(true);
      } else if (!reportView.hidden) {
        /* 리포트는 폴링 안 함(4b) */
      } else {
        if (!listEl.querySelector(".card.open")) load(true);
      }
    }, AUTO_REFRESH_MS);

    // ===== 토대: 테마·글자크기 토글 (헤더 우상단 버튼) =====
    const themeBtn = document.getElementById("themeBtn");
    const fsBtn = document.getElementById("fsBtn");

    function syncThemeBtn() {
      themeBtn.textContent = document.documentElement.dataset.theme === "dark" ? "☀️" : "🌙";
    }
    function rerenderActiveTab() {
      // srcColors가 테마 의존 → 활성 탭만 재렌더 (글자크기는 CSS 변수라 불필요)
      if (!storiesView.hidden) loadStories();
      else if (!reportView.hidden) loadReport();
      else load();
    }
    themeBtn.addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      localStorage.setItem("ns_theme", next);
      syncThemeBtn();
      rerenderActiveTab();
    });
    syncThemeBtn();

    // 글자크기: 작게(.92) → 중간(1) → 크게(1.15) 순환, 현재 상태를 라벨로 표시
    const FS_PRESET = { s: ".92", m: "1", l: "1.15" };
    const FS_LABEL = { s: "가⁻", m: "가", l: "가⁺" };
    const FS_NEXT = { s: "m", m: "l", l: "s" };
    let fsKey = localStorage.getItem("ns_fs");
    if (!FS_PRESET[fsKey]) fsKey = "m";
    function applyFs() {
      document.documentElement.style.setProperty("--fs", FS_PRESET[fsKey]);
      fsBtn.textContent = FS_LABEL[fsKey];
    }
    applyFs();
    fsBtn.addEventListener("click", () => {
      fsKey = FS_NEXT[fsKey];
      localStorage.setItem("ns_fs", fsKey);
      applyFs();
    });
  </script>
</body>
</html>
