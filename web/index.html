<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>newsstore — 뉴스 피드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    // FOUC 방지: 스타일 적용 전에 저장된 테마·글자크기를 루트에 반영
    document.documentElement.dataset.theme = localStorage.getItem("ns_theme")
      || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.style.setProperty("--fs",
      { s: ".92", m: "1", l: "1.15" }[localStorage.getItem("ns_fs") || "m"]);
  </script>
  <script>
    // 부트 워치독(B5): 디폴트 첫 화면=피드라, 모듈 import 실패(config.js 404 등)로 앱이 죽으면
    // 그게 첫 화면이 된다(solved). 정상 부팅이면 모듈이 __nsBooted=true로 이 폴백을 무력화한다.
    window.__nsBooted = false;
    setTimeout(function () {
      if (window.__nsBooted) return;
      var el = document.getElementById("list");
      if (el) el.innerHTML = '<div class="error">앱을 불러오지 못했습니다. 설정 또는 네트워크 문제일 수 있어요.'
        + '<br>새로고침하거나 잠시 후 다시 시도해 주세요.</div>';
    }, 8000);
  </script>
  <style>
    :root {
      --bg:#fdfcf8; --card:#fffefc; --line:#ece6da; --fg:#2f2a23;
      --sub:#4a4236; --mut:#9c9385; --accent:#c0764a; --pill:#f0ebe0; --pill-fg:#6e6558;
      --imp:#bf8f3c; --risk:#c0606d; --green:#4f9e80; --off:#ddd6c9;
      --btn:#fff; --hover:#f0f1f4; --card2:#faf9f6; --line2:#e0ddd5; --leadbg:#f3ede2;
      --headerbg:rgba(241,240,236,.94); --shadow:rgba(40,40,40,.13);
      --price:#4f6bd6;                     /* 가격 탭 정체성색(인디고 — green/red/accent와 분리) */
      --fs:1; --expand-max:min(45vh,380px);
      --side-w:234px;                      /* 사이드바 폭 SSOT — 본문 사이드바 + 헤더 정렬용 고스트가 공유 */
      color-scheme:light;
    }
    :root[data-theme="dark"] {
      --bg:#191713; --card:#211e19; --line:#37322a; --fg:#ece7dd; --sub:#c9c1b2; --mut:#8a8172;
      --accent:#d98d5f; --pill:#2c2820; --pill-fg:#b3a893; --imp:#d4a959; --risk:#d97f8b;
      --green:#6cb89a; --off:#3d382e; --btn:#262219; --hover:#2e2a22; --card2:#1e1b16;
      --line2:#3a352c; --leadbg:#2a2418; --headerbg:rgba(26,24,20,.92); --shadow:rgba(0,0,0,.5);
      --price:#7d95e6;
      color-scheme:dark;
    }
    * { box-sizing: border-box; }
    /* B2(#7): 스크롤바 gutter 상시 예약 — 탭 전환으로 세로 스크롤바가 생겼다 사라지며
       뷰포트 폭이 ~15px 변해 헤더·탭이 가로로 흔들리던 실측 버그(7px shift)를 제거한다. */
    html { scrollbar-gutter: stable; }
    body { margin:0; background:var(--bg); color:var(--fg);
      font-family:"Inter","Noto Sans KR",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      font-size:calc(14.5px*var(--fs)); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
    header { position:sticky; top:0; z-index:5; background:var(--headerbg);
      backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
    .wrap { max-width:760px; margin:0 auto; }
    /* B2(#7): 헤더 내부도 본문과 동일한 layout 그리드(고스트 사이드바 열)에 정렬한다.
       실측 결과 헤더 .wrap(뷰포트 중앙)와 본문 .wrap(사이드바-오프셋 중앙)이 117px(=사이드바폭/2)
       어긋나 있었다. 헤더에 같은 폭의 빈 열(.side-ghost)을 두어 두 .wrap 중심을 일치시킨다. */
    .hmain { flex:1 1 auto; min-width:0; padding:13px 16px; }
    .side-ghost { flex:0 0 var(--side-w); }
    .hrow { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:0 0 9px; }
    .hbtns { display:flex; gap:6px; }
    .hbtns button { min-height:40px; min-width:40px; padding:6px 10px; line-height:1; }
    h1 { font-size:calc(18px*var(--fs)); margin:0; letter-spacing:-.2px; }
    h1 small { color:var(--mut); font-weight:400; font-size:calc(13px*var(--fs)); margin-left:6px; }
    .controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .controls label { color:var(--mut); font-size:calc(13px*var(--fs)); }
    select, button { background:var(--btn); color:var(--fg); border:1px solid var(--line);
      border-radius:8px; padding:6px 11px; font-size:calc(14px*var(--fs)); font-family:inherit; }
    button { cursor:pointer; transition:background .12s; }
    @media (hover:hover) { button:hover { background:var(--hover); } }
    #status { color:var(--mut); font-size:calc(13px*var(--fs)); margin-left:auto; }
    main { padding:13px 16px 28px; }
    .card { background:var(--card); border:1px solid var(--line); border-left-width:4px;
      border-radius:9px; padding:11px 14px; margin:0 0 6px; }
    .card.has-body { cursor:pointer; }
    .card a.title { color:var(--fg); text-decoration:none; font-size:calc(15px*var(--fs)); font-weight:600;
      line-height:1.5; letter-spacing:-.1px; }
    .excerpt { color:var(--sub); font-size:calc(13px*var(--fs)); line-height:1.6; margin:5px 0 0;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
      max-height:3.2em; transition:max-height .18s ease-out; }
    .card.open .excerpt { -webkit-line-clamp:unset; max-height:var(--expand-max); overflow:auto; }
    @media (hover:hover) {
      .card a.title:hover { color:var(--accent); }
      .card:hover { background:var(--hover); border-color:var(--line2); }
    }
    .meta { color:var(--mut); font-size:calc(12px*var(--fs)); margin-top:8px; display:flex; gap:6px;
      align-items:center; flex-wrap:wrap; }
    .pill { background:var(--pill); color:var(--pill-fg); border-radius:999px;
      padding:2px 9px; font-size:calc(11.5px*var(--fs)); }
    .src { font-weight:600; }
    .empty, .error { color:var(--mut); text-align:center; padding:44px 16px; line-height:1.7; }
    .error code { color:var(--accent); }
    @media (max-width:680px) {
      .card { padding:10px 12px; }
      .meta { row-gap:4px; }
    }

    /* ===== 탭 ===== */
    .tabs { display:flex; gap:4px; margin-bottom:9px; }
    .tab { font-weight:600; color:var(--mut); }
    .tab.active { color:var(--fg); border-color:var(--accent); box-shadow:inset 0 -2px 0 var(--accent); }
    .tabprice.active { border-color:var(--price); box-shadow:inset 0 -2px 0 var(--price); }   /* 가격 탭=인디고 */

    /* ===== 상태 패널 (수집 잡·데이터 신선도) — 웜 팔레트 + semantic 상태색, 이모지 없음 ===== */
    .ssummary { display:flex; align-items:center; gap:13px; background:var(--card); border:1px solid var(--line);
      border-radius:12px; padding:15px 17px; margin-bottom:16px; box-shadow:0 1px 2px var(--shadow); }
    .sbeacon { width:11px; height:11px; border-radius:50%; flex:none; background:var(--green);
      box-shadow:0 0 0 4px color-mix(in srgb, var(--green) 20%, transparent); }
    .ssummary.warn .sbeacon { background:var(--imp); box-shadow:0 0 0 4px color-mix(in srgb, var(--imp) 20%, transparent); }
    .ssummary.bad .sbeacon { background:var(--risk); box-shadow:0 0 0 4px color-mix(in srgb, var(--risk) 20%, transparent); }
    .ssummary b { font-size:calc(15px*var(--fs)); font-weight:600; letter-spacing:-.2px; }
    .ssummary span { display:block; color:var(--mut); font-size:calc(12.5px*var(--fs)); margin-top:1px; }
    .slabel { font-size:calc(11px*var(--fs)); font-weight:700; letter-spacing:.04em; text-transform:uppercase;
      color:var(--mut); margin:16px 0 8px 2px; }
    .srows { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
    .strow { display:flex; align-items:center; gap:11px; padding:13px 15px; }
    .strow + .strow { border-top:1px solid var(--line); }
    .sdot { width:8px; height:8px; border-radius:50%; flex:none; background:var(--mut); }
    .strow.ok .sdot { background:var(--green); } .strow.warn .sdot { background:var(--imp); } .strow.bad .sdot { background:var(--risk); }
    .sbody { flex:1; min-width:0; }
    .sname { font-size:calc(14px*var(--fs)); font-weight:550; }
    .sdetail { font-size:calc(12px*var(--fs)); color:var(--mut); margin-top:2px; word-break:break-word; }
    .schip { flex:none; font-size:calc(11px*var(--fs)); font-weight:600; padding:2px 9px; border-radius:999px;
      background:var(--pill); color:var(--pill-fg); }
    .strow.ok .schip { background:color-mix(in srgb, var(--green) 16%, transparent); color:var(--green); }
    .strow.warn .schip { background:color-mix(in srgb, var(--imp) 18%, transparent); color:var(--imp); }
    .strow.bad .schip { background:color-mix(in srgb, var(--risk) 16%, transparent); color:var(--risk); }
    .swhen { flex:none; font-size:calc(11.5px*var(--fs)); color:var(--mut); text-align:right; min-width:56px;
      font-variant-numeric:tabular-nums; }
    [hidden] { display:none !important; }

    /* ===== 모바일 베이스 (토대) ===== */
    @media (max-width:680px) {
      .hmain { padding:9px 12px; }
      h1 small { display:none; }
      main { padding:11px 12px 24px; }
    }

    .sempty { color:var(--mut); text-align:center; padding:34px 16px; line-height:1.7; }

    /* ===== B5: 좌측 사이드바 네비(모바일 드로어) ===== */
    .layout { display:flex; align-items:flex-start; gap:0; max-width:1180px; margin:0 auto; }
    main { flex:1 1 auto; min-width:0; }   /* min-width:0 → 자식 overflow가 레이아웃을 우측으로 밀지 않게 */
    .sidenav { flex:0 0 var(--side-w); position:sticky; top:88px; align-self:flex-start;
      max-height:calc(100vh - 96px); overflow-y:auto; padding:14px 12px 24px;
      border-right:1px solid var(--line); }
    .navtree { display:flex; flex-direction:column; gap:2px; }
    .navlink { display:block; color:var(--sub); text-decoration:none; font-size:calc(12.5px*var(--fs));
      line-height:1.4; padding:5px 8px; border-radius:7px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .navleaf { font-size:calc(12px*var(--fs)); }
    .navleaf-top { font-weight:700; margin-top:2px; color:var(--fg); }
    @media (hover:hover) { .navlink:hover { background:var(--hover); color:var(--fg); } }
    /* 선택 표식(WW5 재디자인): 좌측 색막대·도트 금지 → 전체행 accent 틴트 채움(파일탐색기 selected-row 관용구).
       카드의 4px 좌측 컬러보더·카드 색점과 시각 채널이 달라 충돌 없음. navlink·navtab·스크롤스파이 공통. */
    .navlink.active, .navtab.active { background:color-mix(in srgb, var(--accent) 15%, transparent);
      color:var(--accent); font-weight:600; }
    /* B1(#1): 좌상단 사이드바 토글 — 데스크톱은 접기/펼치기, 모바일은 드로어 여닫기(항상 노출) */
    .hleft { display:flex; align-items:center; gap:9px; min-width:0; }
    .side-toggle { min-height:40px; min-width:40px; padding:6px 10px; line-height:1;
      font-size:calc(16px*var(--fs)); flex:0 0 auto; }
    .navtab { font-weight:600; }
    .navscrim { position:fixed; inset:0; background:rgba(0,0,0,.42); z-index:15; }
    @media (max-width:1000px) { :root { --side-w:186px; } }        /* 중간폭 방어: 사이드바(+고스트) 축소 */
    @media (min-width:681px) {                                    /* 데스크톱: 드로어 상태 강제 해제(리사이즈 잔재 방지) */
      .sidenav { transform:none !important; }
      .navscrim { display:none !important; }
      /* B1(#1·#7): 데스크톱 접기 — 사이드바와 헤더 고스트를 함께 숨겨 본문·헤더가 같이 전체폭 정렬 유지 */
      body.nav-collapsed .sidenav, body.nav-collapsed .side-ghost { display:none; }
    }
    @media (max-width:680px) {                                    /* 모바일: 드로어(고스트 0폭 → 헤더 전체폭) */
      :root { --side-w:0px; }
      .sidenav { position:fixed; top:0; left:0; bottom:0; width:82%; max-width:300px; z-index:20;
        background:var(--card); border-right:1px solid var(--line); box-shadow:0 0 34px var(--shadow);
        max-height:none; transform:translateX(-100%); transition:transform .22s ease; padding-top:18px; }
      .sidenav.open { transform:translateX(0); }
    }
  </style>
</head>
<body>
  <header>
    <div class="layout">
      <div class="side-ghost" aria-hidden="true"></div>
      <div class="hmain"><div class="wrap">
      <div class="hrow">
        <div class="hleft">
          <button id="sideToggle" class="side-toggle" title="사이드바 열기/닫기" aria-label="사이드바 열기/닫기" aria-expanded="true">☰</button>
          <h1>newsstore <small>5분마다 갱신되는 뉴스 피드</small></h1>
        </div>
        <div class="hbtns">
          <button id="fsBtn" title="글자 크기 (작게/중간/크게 순환)" aria-label="글자 크기">가</button>
          <button id="themeBtn" title="배경 밝게/어둡게" aria-label="테마 전환">🌙</button>
        </div>
      </div>
      <div class="tabs">
        <button class="tab active" id="tabFeed">피드</button>
        <button class="tab" id="tabResearch">리서치</button>
        <button class="tab tabprice" id="tabPrice">상태</button>
      </div>
      <div class="controls" id="feedControls" hidden>
        <label for="src">소스</label>
        <select id="src"><option value="__all__">전체</option></select>
        <label for="tag">태그</label>
        <select id="tag"><option value="__all__">전체</option></select>
        <button id="refresh">새로고침</button>
        <span id="status">불러오는 중…</span>
      </div>
      </div></div>
    </div>
  </header>
  <div class="layout">
    <aside class="sidenav" id="sidenav" aria-label="네비게이션">
      <nav class="navtree" id="navTree">
        <a href="#feed" data-tab="feed" class="navlink navtab navleaf-top">피드</a>
        <a href="#research" data-tab="research" class="navlink navtab navleaf-top">리서치</a>
        <a href="#price" data-tab="price" class="navlink navtab navleaf-top">상태</a>
      </nav>
    </aside>
    <main><div class="wrap">
      <div id="feedView" hidden><div id="list"></div></div>
      <div id="priceView" hidden><div id="priceDoc"></div></div>
      <div id="researchView" hidden><div id="researchList"></div></div>
    </div></main>
  </div>
  <div class="navscrim" id="navScrim" hidden></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, query, orderBy, limit, where, getDocs, doc, getDoc }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { firebaseConfig } from "./config.js";
    import { JOBS, CARDS, jobVerdict, isOverdue, relTime as dsRelTime, cardFreshness } from "./dashboard_logic.mjs";

    const listEl = document.getElementById("list");
    const statusEl = document.getElementById("status");
    const tagSel = document.getElementById("tag");
    const srcSel = document.getElementById("src");
    const seenTags = new Set();
    const db = getFirestore(initializeApp(firebaseConfig));

    // WW5 persistence 일관: 트리 폴더 펼침(nav:*)과 WW1 주시·미발생 펼침(extra:*)을 단일 localStorage 스토어로 통일.
    // 값은 명시 boolean(id별). 폴더 기본=펼침, extra 블록 기본=접힘 — isOpen(id, def)로 기본값을 표현.
    const EXPAND_KEY = "ns_expand";
    let expandState;
    try { expandState = JSON.parse(localStorage.getItem(EXPAND_KEY)) || {}; } catch (e) { expandState = {}; }
    function isOpen(id, def) { return id in expandState ? !!expandState[id] : def; }
    function setOpen(id, v) { expandState[id] = v; try { localStorage.setItem(EXPAND_KEY, JSON.stringify(expandState)); } catch (e) {} }

    // 소스명 → 고정 색 (해시 기반). 카드 왼쪽 띠 + 소스 태그.
    // 알려진 소스는 황금각(137.5°) 간격으로 색 배정 → 겹침 최소화, 미지 소스는 해시 폴백
    let SRC_ORDER = [];   // SSOT: Firestore meta/sources(=feeds.yaml에서 도출)에서 채움
    function srcColors(s) {
      const str = s || "?";
      let h, i = SRC_ORDER.indexOf(str);
      if (i >= 0) h = Math.round((i * 137.508) % 360);
      else { let x = 0; for (let j = 0; j < str.length; j++) x = (x * 31 + str.charCodeAt(j)) >>> 0; h = x % 360; }
      // 테마 인지: 다크에선 어두운 배경·밝은 글자 (테마 토글 시 활성 탭 재렌더로 반영)
      if (document.documentElement.dataset.theme === "dark")
        return { bar:`hsl(${h} 55% 50%)`, bg:`hsl(${h} 35% 22%)`, fg:`hsl(${h} 65% 80%)` };
      return { bar:`hsl(${h} 62% 54%)`, bg:`hsl(${h} 64% 95%)`, fg:`hsl(${h} 46% 32%)` };
    }
    // 피드가 이중 인코딩한 &quot; &#39; 등을 실제 문자로 디코드
    const _ta = document.createElement("textarea");
    function decode(s) { _ta.innerHTML = s || ""; return _ta.value; }
    function esc(s) {
      return (s || "").replace(/[&<>"']/g, c =>
        ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
    }
    function txt(s) { return esc(decode(s)); }
    function bodyHtml(s) { return esc(decode(s).trim()); }   // 전문; CSS가 2줄로 클램프, 카드 클릭 시 확장(.open)

    // === FEED-LOGIC-START (node test가 이 마커 사이를 슬라이스해 검증; 순수함수만, DOM/외부스코프 금지) ===
    // 노출 통제는 백엔드 kind 단일 권위(classify가 수집 시점에 박음 — story/spam/digest/sports).
    // 프론트는 목록을 복제하지 않고 'story'만 노출(비-story는 전부 숨김 — 향후 kind도 자동 숨김).
    // kind 없음(레거시·미분류)만 fail-soft 노출(분석 멈춰도 raw 뉴스 보임). SSOT=백엔드 classify.
    function keepInFeed(it) { const k = it && it.kind; return !k || k === "story"; }
    // === FEED-LOGIC-END ===
    function relTime(d) {
      if (!d) return "시간 미상";
      const s = (Date.now() - d.getTime()) / 1000;
      if (s < 60) return "방금";
      if (s < 3600) return Math.floor(s / 60) + "분 전";
      if (s < 86400) return Math.floor(s / 3600) + "시간 전";
      if (s < 7 * 86400) return Math.floor(s / 86400) + "일 전";
      return d.toLocaleDateString("ko-KR");
    }

    function refreshTagOptions(items) {
      let added = false;
      for (const it of items) for (const t of (it.tags || [])) {
        if (!seenTags.has(t)) { seenTags.add(t); added = true; }
      }
      if (!added) return;
      const cur = tagSel.value;
      tagSel.innerHTML = '<option value="__all__">전체</option>' +
        [...seenTags].sort().map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("");
      tagSel.value = cur;
    }

    function render(items, el) {
      el = el || listEl;                     // 대상 컨테이너(피드=list, 리서치=researchList)
      if (!items.length) { el.innerHTML = `<div class="empty">표시할 뉴스가 없습니다.</div>`; return; }
      el.innerHTML = items.map(it => {
        const pub = it.published_at && it.published_at.toDate ? it.published_at.toDate() : null;
        // TruthSocial은 본문을 제목칸에 싣고 있음 → 제목은 "Truth Social", 미리보기는 그 본문
        const isTS = it.source === "TruthSocial";
        const titleHtml = isTS ? "Truth Social" : (txt(it.title) || "(제목 없음)");
        const body = bodyHtml(isTS ? (it.title || it.body) : it.body);
        const c = srcColors(it.source);
        const tags = (it.tags || []).map(t => `<span class="pill">${txt(t)}</span>`).join("");
        return `<div class="card${body ? " has-body" : ""}" style="border-left-color:${c.bar}">
          <a class="title" href="${esc(it.url)}" target="_blank" rel="noopener">${titleHtml}</a>
          ${body ? `<p class="excerpt">${body}</p>` : ""}
          <div class="meta">
            <span class="pill src" style="background:${c.bg};color:${c.fg}">${txt(it.source) || "?"}</span>
            ${it.asset_hint ? `<span class="pill">${txt(it.asset_hint)}</span>` : ""}
            ${tags}
            <span>${relTime(pub)}</span>
          </div>
        </div>`;
      }).join("");
    }

    let loadSeq = 0;                       // 응답 레이스 가드: 늦게 도착한 이전 필터 응답 폐기
    async function load(bg) {
      const seq = ++loadSeq;
      if (!bg) statusEl.textContent = "불러오는 중…";   // 4a: bg면 상태 텍스트 유지
      const tag = tagSel.value, src = srcSel.value;
      const col = collection(db, "items");
      let q;
      if (src !== "__all__")
        q = query(col, where("source", "==", src), orderBy("published_at", "desc"), limit(80));
      else if (tag !== "__all__")
        q = query(col, where("tags", "array-contains", tag), orderBy("published_at", "desc"), limit(80));
      else
        q = query(col, orderBy("published_at", "desc"), limit(80));
      try {
        const snap = await getDocs(q);
        if (seq !== loadSeq) return;                         // 더 새 요청이 나감 → 낡은 응답 버림
        const rawItems = snap.docs.map(d => d.data());
        // 제목(정규화) 기준 중복 제거 — 같은 뉴스가 URL만 달라 여러 번 들어온 경우 한 건만
        const seen = new Set(); const items = [];
        for (const it of rawItems) {
          if (!keepInFeed(it)) continue;                     // 백엔드 kind=spam/digest 숨김(SSOT)
          // 소스+태그 동시 선택: 쿼리는 소스만 걸고(복합 인덱스 회피) 태그는 클라이언트 필터
          if (src !== "__all__" && tag !== "__all__" && !(it.tags || []).includes(tag)) continue;
          const k = decode(it.title).trim().toLowerCase().replace(/\s+/g, " ");
          if (k && seen.has(k)) continue;
          if (k) seen.add(k);
          items.push(it);
        }
        if (tag === "__all__") refreshTagOptions(items);
        render(items);
        statusEl.textContent = `${items.length}건 · ${new Date().toLocaleTimeString("ko-KR")}`;
      } catch (e) {
        if (seq !== loadSeq) return;
        if (/requires an index|currently building/i.test(e.message)) {
          statusEl.textContent = "인덱스 생성 중…";
          listEl.innerHTML = `<div class="empty">소스 필터용 인덱스를 만드는 중이에요 (최초 1회, 보통 1~3분).<br>잠시 후 자동으로 다시 불러옵니다…</div>`;
          setTimeout(load, 20000);
          return;
        }
        statusEl.textContent = "";
        listEl.innerHTML = `<div class="error">불러오기 실패: <code>${esc(e.message)}</code></div>`;
      }
    }

    async function initSources() {
      try {
        const snap = await getDoc(doc(db, "meta", "sources"));
        SRC_ORDER = (snap.exists() && Array.isArray(snap.data().sources)) ? snap.data().sources : [];
      } catch (e) { SRC_ORDER = []; }
      srcSel.innerHTML = '<option value="__all__">전체 소스</option>' +
        SRC_ORDER.map(s => `<option>${esc(s)}</option>`).join("");
      load();
    }
    srcSel.addEventListener("change", load);
    tagSel.addEventListener("change", load);
    document.getElementById("refresh").addEventListener("click", load);
    // 카드 클릭 확장(패턴 E): 링크/버튼 클릭은 토글하지 않음, 본문 있는 카드만
    listEl.addEventListener("click", (e) => {
      if (e.target.closest("a,button,select")) return;
      const card = e.target.closest(".card.has-body");
      if (card) card.classList.toggle("open");
    });

    // ============================ 탭 뷰 참조 (피드·상태) ============================
    const feedView = document.getElementById("feedView");
    const feedControls = document.getElementById("feedControls");
    const tabFeed = document.getElementById("tabFeed");

    // ============================ 사이드바 네비 (B5) ============================
    const sidenav = document.getElementById("sidenav");
    const navTree = document.getElementById("navTree");
    const navScrim = document.getElementById("navScrim");
    const sideToggle = document.getElementById("sideToggle");

    function closeDrawer() { sidenav.classList.remove("open"); navScrim.hidden = true; }
    // B1(#1·#7): 좌상단 토글 — 모바일은 드로어 여닫기, 데스크톱은 접기(nav-collapsed, 상태 유지).
    function isMobileNav() { return matchMedia("(max-width:680px)").matches; }
    function syncSideToggle() {
      const expanded = isMobileNav() ? sidenav.classList.contains("open")
                                     : !document.body.classList.contains("nav-collapsed");
      sideToggle.setAttribute("aria-expanded", expanded ? "true" : "false");
    }
    sideToggle.addEventListener("click", () => {
      if (isMobileNav()) { navScrim.hidden = !sidenav.classList.toggle("open"); }
      else {
        const collapsed = document.body.classList.toggle("nav-collapsed");
        localStorage.setItem("ns_nav", collapsed ? "collapsed" : "open");   // 데스크톱 접힘 상태 유지
      }
      syncSideToggle();
    });
    navScrim.addEventListener("click", () => { closeDrawer(); syncSideToggle(); });
    sidenav.addEventListener("click", e => { if (e.target.closest("a")) { closeDrawer(); syncSideToggle(); } });  // 링크→드로어 닫힘(hashchange가 라우팅)
    matchMedia("(min-width:681px)").addEventListener("change", e => { if (e.matches) closeDrawer(); syncSideToggle(); });  // 데스크톱 진입 시 드로어 잔재 초기화 · 양방향 토글 aria 동기화
    // 데스크톱 접힘 상태 복원(모바일에선 nav-collapsed가 CSS상 무효라 무해)
    if (localStorage.getItem("ns_nav") === "collapsed") document.body.classList.add("nav-collapsed");
    syncSideToggle();

    // ============================ 상태 뷰 (수집 잡·데이터 신선도) ============================
    const priceView = document.getElementById("priceView");
    const priceDocEl = document.getElementById("priceDoc");
    const tabPrice = document.getElementById("tabPrice");

    // 시세 탭 → 수집 상태 패널. 시세·가격 수집은 별개 로컬 앱(DB-news-data)으로 이관됐고,
    // 이 탭은 클라우드 수집 잡의 건강과 데이터 신선도를 보여준다(dashboard_logic 재사용 — 판정 SSOT).
    const _LVLTXT = { ok: "정상", warn: "주의", bad: "점검 필요" };
    const _toMs = (ts) => {
      if (!ts) return null;
      if (typeof ts.toMillis === "function") return ts.toMillis();
      const t = Date.parse(ts); return Number.isFinite(t) ? t : null;
    };
    function statusRow(level, name, detail, when) {
      return `<div class="strow ${level}"><span class="sdot"></span>`
        + `<div class="sbody"><div class="sname">${esc(name)}</div>`
        + (detail ? `<div class="sdetail">${esc(detail)}</div>` : "") + `</div>`
        + `<span class="schip">${_LVLTXT[level] || "—"}</span>`
        + `<span class="swhen">${esc(when)}</span></div>`;
    }
    async function loadStatus(bg) {
      if (!bg) priceDocEl.innerHTML = `<div class="sempty">상태 확인 중…</div>`;
      const now = Date.now(), rank = { ok: 0, warn: 1, bad: 2 };
      let worst = "ok";
      try {
        const jobRows = [];
        for (const j of JOBS) {
          let hd = null;
          try { const s = await getDoc(doc(db, "job_health", j.key)); hd = s.exists() ? s.data() : null; } catch (e) {}
          const h = hd ? { lastStatus: hd.last_status, fetchedMs: _toMs(hd.fetched_at) } : null;
          const v = jobVerdict(h, j.expectedSec, now);
          if (rank[v.level] > rank[worst]) worst = v.level;
          const when = h && h.fetchedMs ? dsRelTime(h.fetchedMs, now) : "기록 없음";
          jobRows.push(statusRow(v.level, j.label, (hd && hd.detail) || v.text, when));
        }
        const cardRows = [];
        for (const c of CARDS) {
          const results = await Promise.all(c.collections.map(async (coll) => {
            const snap = await getDocs(query(collection(db, coll), orderBy("fetched_at", "desc"), limit(1)));
            const d = snap.empty ? null : snap.docs[0].data();
            return { ms: d ? _toMs(d.fetched_at) : null, doc: d };
          }));
          const { lastFetchedMs, anyEmpty } = cardFreshness(results.map(r => r.ms));
          const level = isOverdue(lastFetchedMs, c, now).overdue ? "bad" : "ok";
          if (rank[level] > rank[worst]) worst = level;
          const when = lastFetchedMs == null ? "없음" : dsRelTime(lastFetchedMs, now);
          const d = results[0].doc;
          const detail = d ? `최근: ${d.source || ""}${d.title ? " · " + String(d.title).slice(0, 40) : ""}`
                           : (anyEmpty ? "수집 데이터 없음" : "");
          cardRows.push(statusRow(level, c.label, detail, when));
        }
        // 소스별 최근 기사 + 신선도 — meta/sources(RSS) + 네이버 각각 최신 1건 조회.
        // "오류 여부"는 마지막 수집 경과로 판정(6h 정상·48h 주의·그이상 점검). 저빈도 소스는
        // 자연히 오래되므로 전체 요약(worst)엔 반영하지 않고 행 단위로만 표시(오탐 방지).
        let srcRows = "";
        try {
          const ss = await getDoc(doc(db, "meta", "sources"));
          const names = (ss.exists() && Array.isArray(ss.data().sources)) ? ss.data().sources.slice() : [];
          // 네이버 아이템은 실제 발행처(매일경제·서울경제 등)로 저장되므로 "네이버" 행은 두지 않는다.
          const res = await Promise.all(names.map(async (nm) => {
            try {
              const qs = query(collection(db, "items"), where("source", "==", nm), orderBy("fetched_at", "desc"), limit(1));
              const s = await getDocs(qs);
              if (s.empty) return { nm, ms: null };
              const d = s.docs[0].data();
              return { nm, ms: _toMs(d.fetched_at), title: String(d.title || "") };
            } catch (e) { return { nm, err: e.code || e.message }; }
          }));
          const rows = res.map(r => {
            if (r.err) return { lv: "bad", nm: r.nm, det: "조회 오류: " + r.err, wh: "—", k: -2 };
            if (r.ms == null) return { lv: "bad", nm: r.nm, det: "수집 기록 없음", wh: "없음", k: -1 };
            const age = now - r.ms;
            // 소스마다 발행 주기가 크게 달라(15분 RSS ~ 주단위 리서치) 임계값을 넉넉히: 24h·7일.
            const lv = age < 24 * 3600e3 ? "ok" : age < 7 * 86400e3 ? "warn" : "bad";
            return { lv, nm: r.nm, det: r.title ? "최근: " + r.title.slice(0, 46) : "", wh: dsRelTime(r.ms, now), k: r.ms };
          });
          rows.sort((a, b) => a.k - b.k);   // 오래된·오류 먼저 위로
          srcRows = rows.map(r => statusRow(r.lv, r.nm, r.det, r.wh)).join("");
        } catch (e) {
          srcRows = `<div class="sdetail" style="padding:13px 15px">소스별 상태 조회 실패(색인 생성 중일 수 있어요): <code>${esc(e.message || "")}</code></div>`;
        }
        const title = worst === "ok" ? "모두 정상" : worst === "warn" ? "주의가 필요합니다" : "점검이 필요합니다";
        const sub = worst === "ok" ? "수집 잡과 데이터가 정상 주기로 갱신되고 있어요."
                                   : "아래에서 지연·실패·정지를 확인하세요.";
        priceDocEl.innerHTML =
          `<div class="ssummary ${worst}"><span class="sbeacon"></span>`
          + `<div><b>${title}</b><span>${sub}</span></div></div>`
          + `<p class="slabel">수집 잡</p><div class="srows">${jobRows.join("")}</div>`
          + `<p class="slabel">데이터 신선도</p><div class="srows">${cardRows.join("")}</div>`
          + `<p class="slabel">소스별 최근 기사</p><div class="srows">${srcRows}</div>`;
      } catch (e) {
        priceDocEl.innerHTML = `<div class="sempty">상태 불러오기 실패: <code>${esc(e.message || e.code || "")}</code></div>`;
      }
    }

    // ============================ 리서치 뷰 (analysis 티어 소스) ============================
    // 뉴스와 소비 패턴이 다른 리서치·석학·구루 글을 별도 탭으로. 대상 소스는 meta/sources.tiers에서
    // tier=="analysis"를 도출(하드코딩 X). Firestore in은 최대 30개라 캡. published_at 최신순.
    const researchView = document.getElementById("researchView");
    const researchListEl = document.getElementById("researchList");
    const tabResearch = document.getElementById("tabResearch");
    let researchLoaded = false;
    async function loadResearch(bg) {
      if (!bg) researchListEl.innerHTML = `<div class="empty">불러오는 중…</div>`;
      try {
        const ss = await getDoc(doc(db, "meta", "sources"));
        const tiers = (ss.exists() && ss.data().tiers) ? ss.data().tiers : {};
        const anal = Object.keys(tiers).filter(s => tiers[s] === "analysis").slice(0, 30);
        if (!anal.length) { researchListEl.innerHTML = `<div class="empty">리서치 소스가 아직 없습니다.</div>`; return; }
        const snap = await getDocs(query(collection(db, "items"),
          where("source", "in", anal), orderBy("published_at", "desc"), limit(80)));
        render(snap.docs.map(d => d.data()).filter(keepInFeed), researchListEl);
      } catch (e) {
        if (/requires an index|currently building/i.test(e.message)) {
          researchListEl.innerHTML = `<div class="empty">색인 생성 중이에요 (최초 1회)…</div>`;
          setTimeout(loadResearch, 20000); return;
        }
        researchListEl.innerHTML = `<div class="error">불러오기 실패: <code>${esc(e.message)}</code></div>`;
      }
    }
    researchListEl.addEventListener("click", (e) => {         // 카드 클릭 확장(피드와 동일)
      if (e.target.closest("a,button,select")) return;
      const card = e.target.closest(".card.has-body");
      if (card) card.classList.toggle("open");
    });

    function showTab(which) {
      const price = which === "price", research = which === "research";
      const feed = !price && !research;
      feedView.hidden = !feed; feedControls.hidden = !feed;
      priceView.hidden = !price;
      researchView.hidden = !research;
      tabFeed.classList.toggle("active", feed);
      tabPrice.classList.toggle("active", price);
      tabResearch.classList.toggle("active", research);
      // 사이드바 탭도 현재 탭에 맞춰 active(헤더 탭과 동기화 — 둘 다 hash 라우팅)
      const key = feed ? "feed" : which;
      document.querySelectorAll(".navtab").forEach(a => a.classList.toggle("active", a.dataset.tab === key));
      if (price) loadStatus();     // 상태 패널 — 열 때마다 최신 잡 헬스·신선도 로드
      if (research && !researchLoaded) { researchLoaded = true; loadResearch(); }
    }
    function routeFromHash() {
      const h = location.hash;
      const tab = h === "#price" ? "price" : h === "#research" ? "research" : "feed";
      showTab(tab);
    }
    // 탭 클릭 → 해시 라우팅(hashchange가 showTab 실행)
    tabFeed.addEventListener("click", () => { location.hash = "#feed"; });
    tabPrice.addEventListener("click", () => { location.hash = "#price"; });
    tabResearch.addEventListener("click", () => { location.hash = "#research"; });
    window.addEventListener("hashchange", routeFromHash);

    initSources();
    routeFromHash();
    window.__nsBooted = true;      // B5: 모듈이 여기까지 실행됨 → 부트 워치독 폴백 무력화(import 실패만 폴백 발동)

    // 자동경신: 5분마다 피드 데이터 재로드(헤더 "5분마다 갱신" 약속 이행).
    // 백그라운드 탭이면 스킵(불필요한 read 절감), 펼친 카드가 있으면 스킵(사용자 방해 방지).
    const AUTO_REFRESH_MS = 5 * 60 * 1000;
    setInterval(() => {
      if (!document.hidden && !listEl.querySelector(".card.open")) load(true);
    }, AUTO_REFRESH_MS);

    // ===== 토대: 테마·글자크기 토글 (헤더 우상단 버튼) =====
    const themeBtn = document.getElementById("themeBtn");
    const fsBtn = document.getElementById("fsBtn");

    function syncThemeBtn() {
      themeBtn.textContent = document.documentElement.dataset.theme === "dark" ? "☀️" : "🌙";
    }
    function rerenderActiveTab() {
      // srcColors가 테마 의존 → 피드 재렌더(글자크기는 CSS 변수라 불필요)
      load();
    }
    themeBtn.addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      localStorage.setItem("ns_theme", next);
      syncThemeBtn();
      rerenderActiveTab();
    });
    syncThemeBtn();

    // 글자크기: 작게(.92) → 중간(1) → 크게(1.15) 순환, 현재 상태를 라벨로 표시
    const FS_PRESET = { s: ".92", m: "1", l: "1.15" };
    const FS_LABEL = { s: "가⁻", m: "가", l: "가⁺" };
    const FS_NEXT = { s: "m", m: "l", l: "s" };
    let fsKey = localStorage.getItem("ns_fs");
    if (!FS_PRESET[fsKey]) fsKey = "m";
    function applyFs() {
      document.documentElement.style.setProperty("--fs", FS_PRESET[fsKey]);
      fsBtn.textContent = FS_LABEL[fsKey];
    }
    applyFs();
    fsBtn.addEventListener("click", () => {
      fsKey = FS_NEXT[fsKey];
      localStorage.setItem("ns_fs", fsKey);
      applyFs();
    });
  </script>
</body>
</html>
