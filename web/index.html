<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>newsstore — 뉴스 피드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#f1f0ec; --card:#ffffff; --line:#e4e2db; --fg:#22262c;
      --sub:#4d5563; --mut:#8b929d; --accent:#2563eb; --pill:#eef0f3; --pill-fg:#4a5260;
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg);
      font-family:"Inter","Noto Sans KR",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      font-size:14.5px; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
    header { position:sticky; top:0; z-index:5; background:rgba(241,240,236,.94);
      backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:13px 16px; }
    .wrap { max-width:760px; margin:0 auto; }
    h1 { font-size:18px; margin:0 0 9px; letter-spacing:-.2px; }
    h1 small { color:var(--mut); font-weight:400; font-size:13px; margin-left:6px; }
    .controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .controls label { color:var(--mut); font-size:13px; }
    select, button { background:#fff; color:var(--fg); border:1px solid var(--line);
      border-radius:8px; padding:6px 11px; font-size:14px; font-family:inherit; }
    button { cursor:pointer; transition:background .12s; }
    button:hover { background:#f0f1f4; }
    #status { color:var(--mut); font-size:13px; margin-left:auto; }
    main { padding:13px 16px 28px; }
    .card { background:var(--card); border:1px solid var(--line); border-left-width:4px;
      border-radius:9px; padding:11px 14px; margin:0 0 6px; }
    .card a.title { color:var(--fg); text-decoration:none; font-size:15px; font-weight:600;
      line-height:1.5; letter-spacing:-.1px; }
    .card a.title:hover { color:var(--accent); }
    .excerpt { color:var(--sub); font-size:13px; line-height:1.6; margin:5px 0 0;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .card:hover { background:#fbfbf9; border-color:#d8d6cf; }
    .card:hover .excerpt { -webkit-line-clamp:99; overflow:visible; }
    .meta { color:var(--mut); font-size:12px; margin-top:8px; display:flex; gap:6px;
      align-items:center; flex-wrap:wrap; }
    .pill { background:var(--pill); color:var(--pill-fg); border-radius:999px;
      padding:2px 9px; font-size:11.5px; }
    .src { font-weight:600; }
    .empty, .error { color:var(--mut); text-align:center; padding:44px 16px; line-height:1.7; }
    .error code { color:var(--accent); }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>newsstore <small>5분마다 갱신되는 뉴스 피드</small></h1>
      <div class="controls">
        <label for="src">소스</label>
        <select id="src"><option value="__all__">전체</option></select>
        <label for="tag">태그</label>
        <select id="tag"><option value="__all__">전체</option></select>
        <button id="refresh">새로고침</button>
        <span id="status">불러오는 중…</span>
      </div>
    </div>
  </header>
  <main><div class="wrap" id="list"></div></main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, query, orderBy, limit, where, getDocs }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAs-PhCFJ7_RkIOkDfv8FrIYxdyphT8Ofk",
      authDomain: "daily-recap-498506.firebaseapp.com",
      projectId: "daily-recap-498506",
      storageBucket: "daily-recap-498506.firebasestorage.app",
      messagingSenderId: "754646487603",
      appId: "1:754646487603:web:19e77fba52a8aacf1b0946",
    };

    const listEl = document.getElementById("list");
    const statusEl = document.getElementById("status");
    const tagSel = document.getElementById("tag");
    const srcSel = document.getElementById("src");
    const seenTags = new Set();
    const db = getFirestore(initializeApp(firebaseConfig));

    // 소스명 → 고정 색 (해시 기반). 카드 왼쪽 띠 + 소스 태그.
    // 알려진 소스는 황금각(137.5°) 간격으로 색 배정 → 겹침 최소화, 미지 소스는 해시 폴백
    const SRC_ORDER = ["인포맥스","한국경제","매일경제","Benzinga","CoinDesk","Cointelegraph",
      "ForexLive","InvestingLive","FXStreet","Investing","Fed","ECB","Bloomberg","GoogleNews",
      "TruthSocial","Axios","Reuters","FinancialJuice"];
    function srcColors(s) {
      const str = s || "?";
      let h, i = SRC_ORDER.indexOf(str);
      if (i >= 0) h = Math.round((i * 137.508) % 360);
      else { let x = 0; for (let j = 0; j < str.length; j++) x = (x * 31 + str.charCodeAt(j)) >>> 0; h = x % 360; }
      return { bar:`hsl(${h} 62% 54%)`, bg:`hsl(${h} 64% 95%)`, fg:`hsl(${h} 46% 32%)` };
    }
    // 피드가 이중 인코딩한 &quot; &#39; 등을 실제 문자로 디코드
    const _ta = document.createElement("textarea");
    function decode(s) { _ta.innerHTML = s || ""; return _ta.value; }
    function esc(s) {
      return (s || "").replace(/[&<>"']/g, c =>
        ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
    }
    function txt(s) { return esc(decode(s)); }
    function bodyHtml(s) { return esc(decode(s).trim()); }   // 전문; CSS가 2줄로 클램프, 호버 시 전체

    // 변호사/집단소송 PR 스팸 필터 — 제목+본문에 아래 시그널이 있으면 숨김 (고정밀)
    const JUNK = ["lead plaintiff", "class action", "deadline alert", "shareholder rights law firm",
      "suffered losses in", "encourages investors", "reminds investors", "securities fraud",
      "bragar eagel", "rosen law", "pomerantz", "levi & korsinsky", "glancy prongay", "kahn swick",
      "robbins geller", "faruqi", "schall law", "hagens berman", "kessler topaz", "bronstein, gewirtz",
      "gross law firm", "johnson fistel", "kirby mcinerney",
      // 벤징가 "$X 투자했다면 지금 얼마" 류 클릭베이트
      "would be worth this much today", "if an investor had bought"];
    function isJunk(it) {
      const s = (decode(it.title) + " " + decode(it.body)).toLowerCase();
      return JUNK.some(k => s.includes(k));
    }
    function relTime(d) {
      if (!d) return "시간 미상";
      const s = (Date.now() - d.getTime()) / 1000;
      if (s < 60) return "방금";
      if (s < 3600) return Math.floor(s / 60) + "분 전";
      if (s < 86400) return Math.floor(s / 3600) + "시간 전";
      if (s < 7 * 86400) return Math.floor(s / 86400) + "일 전";
      return d.toLocaleDateString("ko-KR");
    }

    function refreshTagOptions(items) {
      let added = false;
      for (const it of items) for (const t of (it.tags || [])) {
        if (!seenTags.has(t)) { seenTags.add(t); added = true; }
      }
      if (!added) return;
      const cur = tagSel.value;
      tagSel.innerHTML = '<option value="__all__">전체</option>' +
        [...seenTags].sort().map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("");
      tagSel.value = cur;
    }

    function render(items) {
      if (!items.length) { listEl.innerHTML = `<div class="empty">표시할 뉴스가 없습니다.</div>`; return; }
      listEl.innerHTML = items.map(it => {
        const pub = it.published_at && it.published_at.toDate ? it.published_at.toDate() : null;
        // TruthSocial은 본문을 제목칸에 싣고 있음 → 제목은 "Truth Social", 미리보기는 그 본문
        const isTS = it.source === "TruthSocial";
        const titleHtml = isTS ? "Truth Social" : (txt(it.title) || "(제목 없음)");
        const body = bodyHtml(isTS ? (it.title || it.body) : it.body);
        const c = srcColors(it.source);
        const tags = (it.tags || []).map(t => `<span class="pill">${txt(t)}</span>`).join("");
        return `<div class="card" style="border-left-color:${c.bar}">
          <a class="title" href="${esc(it.url)}" target="_blank" rel="noopener">${titleHtml}</a>
          ${body ? `<p class="excerpt">${body}</p>` : ""}
          <div class="meta">
            <span class="pill src" style="background:${c.bg};color:${c.fg}">${txt(it.source) || "?"}</span>
            ${it.asset_hint ? `<span class="pill">${txt(it.asset_hint)}</span>` : ""}
            ${tags}
            <span>${relTime(pub)}</span>
          </div>
        </div>`;
      }).join("");
    }

    async function load() {
      statusEl.textContent = "불러오는 중…";
      const tag = tagSel.value, src = srcSel.value;
      const col = collection(db, "items");
      let q;
      if (src !== "__all__")
        q = query(col, where("source", "==", src), orderBy("published_at", "desc"), limit(80));
      else if (tag !== "__all__")
        q = query(col, where("tags", "array-contains", tag), orderBy("published_at", "desc"), limit(80));
      else
        q = query(col, orderBy("published_at", "desc"), limit(80));
      try {
        const snap = await getDocs(q);
        const rawItems = snap.docs.map(d => d.data());
        // 제목(정규화) 기준 중복 제거 — 같은 뉴스가 URL만 달라 여러 번 들어온 경우 한 건만
        const seen = new Set(); const items = [];
        for (const it of rawItems) {
          if (isJunk(it)) continue;                          // 집단소송 PR 스팸 제거
          const k = decode(it.title).trim().toLowerCase().replace(/\s+/g, " ");
          if (k && seen.has(k)) continue;
          if (k) seen.add(k);
          items.push(it);
        }
        if (tag === "__all__") refreshTagOptions(items);
        render(items);
        statusEl.textContent = `${items.length}건 · ${new Date().toLocaleTimeString("ko-KR")}`;
      } catch (e) {
        statusEl.textContent = "";
        listEl.innerHTML = `<div class="error">불러오기 실패: <code>${esc(e.message)}</code></div>`;
      }
    }

    srcSel.innerHTML = '<option value="__all__">전체 소스</option>' +
      SRC_ORDER.map(s => `<option>${esc(s)}</option>`).join("");
    srcSel.addEventListener("change", load);
    tagSel.addEventListener("change", load);
    document.getElementById("refresh").addEventListener("click", load);
    load();
  </script>
</body>
</html>
